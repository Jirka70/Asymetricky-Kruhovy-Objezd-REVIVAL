name: asymetricky-kruhovy-objezd

x-otp-common: &otp-common
  image: docker.io/opentripplanner/opentripplanner:latest
  environment:
    JAVA_TOOL_OPTIONS: "-Xmx8g"
  volumes:
    - ./location_data:/var/opentripplanner

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    init: true
    stop_grace_period: 15s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/kraj', { signal: AbortSignal.timeout(3000) }).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

  otp-build:
    <<: *otp-common
    profiles: ["build"]
    command: ["--build", "--save"]
    restart: "no"

  otp:
    <<: *otp-common
    profiles: ["otp"]
    command: ["--load", "--serve"]
    ports:
      - "8080:8080"
    restart: unless-stopped
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # libpq reads credentials from PG* variables, including special characters.
      DATABASE_URL: "host=db port=5432"
      PGDATABASE: ${POSTGRES_DB:-obor_na_dosah}
      PGUSER: ${POSTGRES_USER:-obor}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      BIND_ADDRESS: "0.0.0.0:8000"
      DB_POOL_SIZE: ${DB_POOL_SIZE:-8}
      RUST_LOG: ${RUST_LOG:-obor_backend=info}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    init: true
    stop_grace_period: 15s
  db:
    image: postgis/postgis:18-3.6
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-obor_na_dosah}
      POSTGRES_USER: ${POSTGRES_USER:-obor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

volumes:
  postgres_data:
