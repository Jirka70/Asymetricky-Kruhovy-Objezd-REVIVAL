openapi: 3.1.0
info:
  title: Obor na dosah API
  version: 2.0.0
  summary: Výběr střední školy podle dojezdu a analýza kapacit a oborů v Karlovarském kraji.
  description: |
    API slouží dvěma skupinám uživatelů:

    - **Student** zadá, odkud cestuje, a uvidí, které školy s jeho oborem stihne ráno dojet a jakým spojem.
    - **Úředník** vidí, kde děti nemají obor v dosahu, kde jsou přeplněné nebo poloprázdné kapacity
      a na které škole by přidání oboru pomohlo nejvíc dětem.

    API je jen pro čtení. Mapové vrstvy jsou GeoJSON (WGS 84, EPSG:4326).
    Jediný endpoint, který volá OpenTripPlanner živě, je `/student/trasa`; ostatní čtou
    předpočítanou matici dojezdů ZSJ × škola.

    **Klíčové definice**

    | Pojem | Definice |
    | --- | --- |
    | `deti` | Odhad jednoho ročníku nastupujícího na SŠ v roce 2026: věková skupina 10–14 let ze SLDB 2021 v ZSJ, děleno 5. Modelový odhad bez stěhování. |
    | Škola v dosahu | Doba dojezdu ze ZSJ ve scénáři `scenar` je nejvýš `max_min` minut. |
    | Obor v dosahu | Obor se v denní formě učí aspoň na jedné škole v dosahu. |
    | Děti bez oboru | Součet `deti` v ZSJ, kde obor v dosahu není. |
    | `prihlasky_na_misto` | Přihlášky / kapacita (přijímací řízení 2026, 1. kolo). |
    | `index_pretlaku` | `prihlasky_na_misto` / průměr kraje (2,66). 1,0 = průměr. |
    | `mist_na_100_deti` | 100 × kapacita oboru / děti, které mají obor v dosahu. |

    **Konvence**
    - Kódy (ZSJ, obec, REDIZO, obor) jsou vždy řetězce kvůli úvodním nulám.
    - Kód oboru obsahuje lomítko; v cestě se kóduje (`23-68-H%2F01`).
    - Nový scénář dojezdu (např. odpoledne zpět) = nový řádek v tabulce `SCENAR` a nový předpočet; API se nemění.
servers:
  - url: http://localhost:8000/api/v1
    description: Lokální vývoj (uvicorn)
tags:
  - name: Společné
    description: Číselníky a školy, používají oba pohledy.
  - name: Student
    description: Školy v dosahu z bodu a spojení do školy.
  - name: Úředník
    description: Dostupnost oborů, bilance kapacit a návrhy, kde obor přidat.

paths:
  /ciselniky:
    get:
      tags: [Společné]
      operationId: getCiselniky
      summary: Všechny číselníky jedním voláním
      description: Obory, obce s počtem dětí, scénáře dojezdu a stupně vzdělání. Načíst jednou při startu aplikace.
      responses:
        '200':
          description: Číselníky.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ciselniky' }

  /skoly:
    get:
      tags: [Společné]
      operationId: listSkoly
      summary: Školy jako body na mapě
      description: Bez filtru vrátí všech 34 škol; 4 školy bez nabídky mají `pocet_nabidek` 0.
      parameters:
        - $ref: '#/components/parameters/OborFiltr'
        - $ref: '#/components/parameters/Stupen'
        - $ref: '#/components/parameters/Forma'
      responses:
        '200':
          description: GeoJSON bodů škol.
          content:
            application/geo+json:
              schema: { $ref: '#/components/schemas/SkolyFeatureCollection' }
        '422': { $ref: '#/components/responses/NeplatnyParametr' }

  /skoly/{redizo}:
    get:
      tags: [Společné]
      operationId: getSkola
      summary: Detail školy, její nabídka a spádová oblast
      parameters:
        - name: redizo
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Redizo' }
          example: '600009084'
        - $ref: '#/components/parameters/MaxMin'
        - $ref: '#/components/parameters/Scenar'
      responses:
        '200':
          description: Detail školy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkolaDetail' }
        '404': { $ref: '#/components/responses/Nenalezeno' }
        '422': { $ref: '#/components/responses/NeplatnyParametr' }

  /student/skoly:
    get:
      tags: [Student]
      operationId: listStudentSkoly
      summary: Školy seřazené podle doby dojezdu z bodu
      description: |
        API najde ZSJ, do které bod padne, a vrátí doby dojezdu z předpočtu pro tuto ZSJ
        (časy jsou orientační z reprezentačního bodu ZSJ). Přesné spojení z bodu vrací `/student/trasa`.

        Bez `obor` vrací jen školy v dosahu. S `obor` vrací všechny školy s tímto oborem,
        i mimo dosah (`v_dosahu: false`).
      parameters:
        - $ref: '#/components/parameters/Lat'
        - $ref: '#/components/parameters/Lon'
        - $ref: '#/components/parameters/OborFiltr'
        - $ref: '#/components/parameters/Forma'
        - $ref: '#/components/parameters/MaxMin'
        - $ref: '#/components/parameters/Scenar'
      responses:
        '200':
          description: Školy se spojem.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentSkoly' }
        '422': { $ref: '#/components/responses/NeplatnyParametr' }

  /student/trasa:
    get:
      tags: [Student]
      operationId: getStudentTrasa
      summary: Spojení z bodu do školy na mapě (živě z OpenTripPlanneru)
      description: |
        Vrací až 3 spoje s příjezdem v okně scénáře, seřazené od nejkratšího.
        Každý úsek je GeoJSON `Feature` s geometrií `LineString`; úseky stejného spoje
        spojuje `properties.spoj`. Odpověď se cachuje 24 hodin podle bodu zaokrouhleného na ~100 m.
      parameters:
        - $ref: '#/components/parameters/Lat'
        - $ref: '#/components/parameters/Lon'
        - name: redizo
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Redizo' }
          example: '600009084'
        - $ref: '#/components/parameters/Scenar'
      responses:
        '200':
          description: Spoje a jejich úseky.
          content:
            application/geo+json:
              schema: { $ref: '#/components/schemas/Trasa' }
        '404': { $ref: '#/components/responses/Nenalezeno' }
        '422': { $ref: '#/components/responses/NeplatnyParametr' }
        '502':
          description: OpenTripPlanner neodpověděl. Frontend může ukázat souhrn z `/student/skoly`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Chyba' }

  /analyza/obce:
    get:
      tags: [Úředník]
      operationId: getAnalyzaObce
      summary: Mapa obcí – kde děti nemají obor nebo školu v dosahu
      description: |
        S `obor`: kolik dětí v obci obor v dosahu nemá a jak daleko je nejbližší škola s oborem.
        Bez `obor`: kolik oborů a škol má obec v dosahu a kolik dětí nemá v dosahu žádnou školu.
        `stupen` omezí obory na daný stupeň (např. `H` = má dítě v dosahu nějaký učební obor?).
      parameters:
        - $ref: '#/components/parameters/OborFiltr'
        - $ref: '#/components/parameters/Stupen'
        - $ref: '#/components/parameters/MaxMin'
        - $ref: '#/components/parameters/Scenar'
      responses:
        '200':
          description: GeoJSON polygonů obcí s ukazateli.
          content:
            application/geo+json:
              schema: { $ref: '#/components/schemas/AnalyzaObce' }
        '422': { $ref: '#/components/responses/NeplatnyParametr' }

  /analyza/obory:
    get:
      tags: [Úředník]
      operationId: listAnalyzaObory
      summary: Bilance oborů – přetlak, dostupnost, kapacita na děti, trh práce
      parameters:
        - $ref: '#/components/parameters/Stupen'
        - $ref: '#/components/parameters/MaxMin'
        - $ref: '#/components/parameters/Scenar'
        - name: signal
          in: query
          description: Jen obory s daným signálem; více hodnot oddělit čárkou.
          schema: { type: string, example: 'pretlak,spatna_dostupnost' }
        - name: razeni
          in: query
          description: Pole pro řazení; mínus = sestupně.
          schema:
            type: string
            enum: [index_pretlaku, -index_pretlaku, deti_bez_oboru, -deti_bez_oboru,
                   mist_na_100_deti, -mist_na_100_deti, volna_mista_na_misto, -volna_mista_na_misto, nazev]
            default: -index_pretlaku
      responses:
        '200':
          description: Řádek za každý obor.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/BilanceOboru' }
                  meta: { $ref: '#/components/schemas/MetaAnalyza' }
        '422': { $ref: '#/components/responses/NeplatnyParametr' }

  /analyza/obory/{kod}:
    get:
      tags: [Úředník]
      operationId: getAnalyzaObor
      summary: Detail oboru – kde je přeplněný, kde chybí, kam ho přidat
      parameters:
        - name: kod
          in: path
          required: true
          description: Kód oboru KKOV, lomítko kódované jako `%2F`.
          schema: { $ref: '#/components/schemas/KodOboru' }
          example: 23-68-H%2F01
        - $ref: '#/components/parameters/MaxMin'
        - $ref: '#/components/parameters/Scenar'
        - name: kandidatu
          in: query
          description: Kolik kandidátních škol vrátit.
          schema: { type: integer, minimum: 1, maximum: 34, default: 5 }
      responses:
        '200':
          description: Detail oboru.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailOboru' }
        '404': { $ref: '#/components/responses/Nenalezeno' }
        '422': { $ref: '#/components/responses/NeplatnyParametr' }

  /analyza/simulace:
    get:
      tags: [Úředník]
      operationId: getAnalyzaSimulace
      summary: Simulace – co kdyby škola učila obor s danou kapacitou
      description: |
        Vrátí slovník podle `kod_zsj` s dobou dojezdu ke škole a počtem potenciálních uchazečů.
        Obsahuje jen ZSJ, které školu stihnou do `max_min`. Nic se neukládá.

        - Potenciální uchazeči v ZSJ = `deti` × `podil_zajmu`, kde `podil_zajmu` je podíl oboru
          na všech přihláškách v kraji (např. 455 / 9 489 = 0,048). Hodnota je očekávaný počet, proto desetinná.
        - `novy_dosah` = ZSJ dnes obor v dosahu nemá.
        - `nejblizsi_stavajici_min` = čas ke stávající nejbližší škole s oborem (null = žádná v dosahu).
        - Když škola obor už učí, jde o navýšení kapacity (`meta.skola_obor_uz_uci: true`).

        S `format=geojson` vrací totéž jako GeoJSON polygonů ZSJ.
      parameters:
        - name: redizo
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Redizo' }
          example: '600009271'
        - name: obor
          in: query
          required: true
          description: Kód oboru KKOV.
          schema: { $ref: '#/components/schemas/KodOboru' }
          example: 23-68-H/01
        - name: kapacita
          in: query
          required: true
          description: Počet míst v prvním ročníku.
          schema: { type: integer, minimum: 1, maximum: 300 }
          example: 24
        - $ref: '#/components/parameters/MaxMin'
        - $ref: '#/components/parameters/Scenar'
        - name: format
          in: query
          schema: { type: string, enum: [slovnik, geojson], default: slovnik }
      responses:
        '200':
          description: Výsledek simulace.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Simulace' }
              example:
                zsj:
                  '197769': { cas_min: 6, deti: 9, potencialni_uchazeci: 0.4, novy_dosah: true, nejblizsi_stavajici_min: null }
                  '006751': { cas_min: 28, deti: 12, potencialni_uchazeci: 0.6, novy_dosah: false, nejblizsi_stavajici_min: 47 }
                souhrn: { zsj_v_dosahu: 96, deti_v_dosahu: 640, potencialni_uchazeci: 30.7, z_toho_novy_dosah: 6.7,
                          blize_ke_skole: 18.4, kapacita: 24, uchazecu_na_misto: 1.28 }
                meta: { redizo: '600009271', obor: 23-68-H/01, scenar: rano, max_min: 60,
                        podil_zajmu: 0.048, skola_obor_uz_uci: false }
            application/geo+json:
              schema: { $ref: '#/components/schemas/SimulaceGeojson' }
        '404': { $ref: '#/components/responses/Nenalezeno' }
        '422': { $ref: '#/components/responses/NeplatnyParametr' }

components:
  headers:
    ETag:
      description: Verze importu dat; při shodě s `If-None-Match` vrací API 304.
      schema: { type: string }

  parameters:
    Lat:
      name: lat
      in: query
      required: true
      description: Zeměpisná šířka výchozího bodu (WGS 84). Bod musí ležet v Karlovarském kraji.
      schema: { type: number, minimum: 49.9, maximum: 50.5 }
      example: 50.2312
    Lon:
      name: lon
      in: query
      required: true
      description: Zeměpisná délka výchozího bodu (WGS 84).
      schema: { type: number, minimum: 12.0, maximum: 13.4 }
      example: 12.8711
    MaxMin:
      name: max_min
      in: query
      description: Nejdelší přijatelná doba dojezdu v minutách.
      schema: { type: integer, minimum: 10, maximum: 120, default: 60 }
    Scenar:
      name: scenar
      in: query
      description: Scénář dojezdu (seznam v `/ciselniky`). Zatím jen `rano` – příjezd 7:30–8:00.
      schema: { type: string, default: rano, example: rano }
    OborFiltr:
      name: obor
      in: query
      description: Kód oboru KKOV (v query není třeba lomítko kódovat).
      schema: { $ref: '#/components/schemas/KodOboru' }
      example: 23-68-H/01
    Stupen:
      name: stupen
      in: query
      description: Stupeň vzdělání (písmeno v kódu KKOV); více hodnot oddělit čárkou.
      schema: { type: string, pattern: '^[CEHKLM](,[CEHKLM])*$' }
      example: H
    Forma:
      name: forma
      in: query
      description: Forma vzdělávání. Pro výpočet dosahu se vždy bere jen denní.
      schema: { type: string, enum: [den, dal] }

  responses:
    Nenalezeno:
      description: Záznam neexistuje.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Chyba' }
          example:
            error: { kod: nenalezeno, zprava: 'Škola 600000000 neexistuje.', pole: redizo }
    NeplatnyParametr:
      description: Neplatný parametr (neznámý obor nebo scénář, bod mimo kraj…).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Chyba' }
          example:
            error: { kod: mimo_kraj, zprava: 'Bod neleží v Karlovarském kraji.', pole: lat }

  schemas:
    KodZsj: { type: string, pattern: '^\d{6}$', example: '063622' }
    KodObce: { type: string, pattern: '^\d{6}$', example: '554961' }
    Redizo: { type: string, pattern: '^\d{9}$', example: '600009084' }
    KodOboru: { type: string, pattern: '^\d{2}-\d{2}-[A-Z]/\d{2}$', example: 23-68-H/01 }
    Stupen:
      type: string
      enum: [C, E, H, K, L, M]
      description: C praktická škola, E praktické obory, H výuční list, K gymnázium, L maturita s praxí / nástavba, M maturita.
    Signal:
      type: string
      enum: [pretlak, nizky_zajem, spatna_dostupnost, poptavka_trhu]
    Cas:
      type: string
      pattern: '^\d{2}:\d{2}$'
      example: '07:41'

    Chyba:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [kod, zprava]
          properties:
            kod: { type: string }
            zprava: { type: string }
            pole: { type: [string, 'null'] }

    MetaDosah:
      type: object
      required: [scenar, max_min]
      properties:
        scenar: { type: string, example: rano }
        max_min: { type: integer, example: 60 }

    MetaAnalyza:
      allOf:
        - $ref: '#/components/schemas/MetaDosah'
        - type: object
          properties:
            deti_celkem: { type: integer, description: Děti v celém kraji. }
            prumer_prihlasek_na_misto: { type: number, example: 2.66 }
            prahy:
              type: object
              description: Prahy pro `signaly`.
              properties:
                pretlak: { type: number, example: 1.5 }
                nizky_zajem: { type: number, example: 0.5 }
                spatna_dostupnost: { type: number, example: 50, description: '% dětí v dosahu' }
                poptavka_trhu: { type: number, example: 2, description: volná místa na 1 místo ve škole }
            definice_deti: { type: string, example: 'Odhad ročníku 2026: 10–14 let (SLDB 2021) / 5' }

    Ciselniky:
      type: object
      required: [obory, obce, scenare, stupne]
      properties:
        obory:
          type: array
          items:
            type: object
            required: [kod, nazev, stupen, pocet_skol]
            properties:
              kod: { $ref: '#/components/schemas/KodOboru' }
              nazev: { type: string, example: Mechanik opravář motorových vozidel }
              stupen: { $ref: '#/components/schemas/Stupen' }
              skupina: { type: string, example: '23', description: První dvojčíslí KKOV. }
              pocet_skol: { type: integer, example: 4 }
        obce:
          type: array
          items:
            type: object
            required: [kod_obce, nazev, deti]
            properties:
              kod_obce: { $ref: '#/components/schemas/KodObce' }
              nazev: { type: string, example: Karlovy Vary }
              deti: { type: integer }
              lat: { type: number }
              lon: { type: number }
        scenare:
          type: array
          items:
            type: object
            required: [id, popis, vychozi]
            properties:
              id: { type: string, example: rano }
              popis: { type: string, example: 'Příjezd do školy 7:30–8:00, běžný školní den' }
              smer: { type: string, enum: [do_skoly, ze_skoly] }
              okno: { type: array, items: { $ref: '#/components/schemas/Cas' }, example: ['07:30', '08:00'] }
              vychozi: { type: boolean }
        stupne:
          type: array
          items:
            type: object
            properties:
              kod: { $ref: '#/components/schemas/Stupen' }
              popis: { type: string, example: Výuční list }
        meta:
          type: object
          properties:
            prijimaci_rizeni:
              type: object
              properties:
                rok: { type: integer, example: 2026 }
                kolo: { type: integer, example: 1 }
            prumer_prihlasek_na_misto: { type: number, example: 2.66 }

    Nabidka:
      type: object
      required: [kod_oboru, nazev_oboru, forma, kapacita, prihlasky]
      properties:
        kod_oboru: { $ref: '#/components/schemas/KodOboru' }
        nazev_oboru: { type: string }
        zamereni: { type: [string, 'null'] }
        stupen: { $ref: '#/components/schemas/Stupen' }
        forma: { type: string, enum: [den, dal] }
        delka_let: { type: integer, example: 3 }
        kapacita: { type: integer, example: 30 }
        prihlasky: { type: integer, example: 131 }
        prihlasky_na_misto: { type: [number, 'null'], example: 4.37 }
        index_pretlaku: { type: [number, 'null'], example: 1.64 }

    GeoPoint:
      type: object
      required: [type, coordinates]
      properties:
        type: { type: string, const: Point }
        coordinates: { type: array, minItems: 2, maxItems: 2, items: { type: number }, example: [12.95214, 50.30477] }
    GeoPlocha:
      type: object
      required: [type, coordinates]
      properties:
        type: { type: string, enum: [Polygon, MultiPolygon] }
        coordinates: { type: array, items: {} }
    GeoLinie:
      type: object
      required: [type, coordinates]
      properties:
        type: { type: string, const: LineString }
        coordinates:
          type: array
          items: { type: array, minItems: 2, maxItems: 2, items: { type: number } }

    SkolyFeatureCollection:
      type: object
      required: [type, features]
      properties:
        type: { type: string, const: FeatureCollection }
        features:
          type: array
          items:
            type: object
            required: [type, geometry, properties]
            properties:
              type: { type: string, const: Feature }
              geometry: { $ref: '#/components/schemas/GeoPoint' }
              properties:
                type: object
                required: [redizo, nazev, pocet_nabidek]
                properties:
                  redizo: { $ref: '#/components/schemas/Redizo' }
                  nazev: { type: string }
                  obec: { type: string, example: Ostrov }
                  pocet_nabidek: { type: integer, example: 8 }
                  kapacita: { type: integer, example: 240 }
                  prihlasky: { type: integer, example: 724 }
                  index_pretlaku: { type: [number, 'null'], example: 1.14 }

    SkolaDetail:
      type: object
      required: [redizo, nazev, lat, lon, nabidky, spadovost]
      properties:
        redizo: { $ref: '#/components/schemas/Redizo' }
        nazev: { type: string }
        adresa: { type: string, example: 'Klínovecká 1197, 36301 Ostrov' }
        web: { type: [string, 'null'], format: uri }
        lat: { type: number }
        lon: { type: number }
        nabidky:
          type: array
          items: { $ref: '#/components/schemas/Nabidka' }
        spadovost:
          type: object
          description: Odkud se do školy dá dojet do `max_min`.
          properties:
            deti_v_dosahu: { type: integer }
            obce:
              type: array
              items:
                type: object
                properties:
                  kod_obce: { $ref: '#/components/schemas/KodObce' }
                  nazev: { type: string }
                  deti: { type: integer }
                  nejkratsi_cas_min: { type: integer }
        meta: { $ref: '#/components/schemas/MetaDosah' }

    Spoj:
      type: object
      required: [stav]
      properties:
        stav: { type: string, enum: [ok, bez_spojeni] }
        odjezd: { oneOf: [{ $ref: '#/components/schemas/Cas' }, { type: 'null' }] }
        prijezd: { oneOf: [{ $ref: '#/components/schemas/Cas' }, { type: 'null' }] }
        cas_min: { type: [integer, 'null'], example: 36 }
        prestupy: { type: [integer, 'null'], example: 0 }
        chuze_m: { type: [integer, 'null'], example: 540 }
        linky: { type: array, items: { type: string }, example: ['421'] }

    StudentSkoly:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            type: object
            required: [redizo, nazev, lat, lon, v_dosahu, spoj, nabidky]
            properties:
              redizo: { $ref: '#/components/schemas/Redizo' }
              nazev: { type: string }
              lat: { type: number }
              lon: { type: number }
              v_dosahu: { type: boolean }
              spoj: { $ref: '#/components/schemas/Spoj' }
              nabidky:
                type: array
                description: S filtrem `obor` jen nabídky tohoto oboru, jinak všechny.
                items: { $ref: '#/components/schemas/Nabidka' }
        meta:
          allOf:
            - $ref: '#/components/schemas/MetaDosah'
            - type: object
              properties:
                zsj: { $ref: '#/components/schemas/KodZsj' }
                v_dosahu: { type: integer }
                mimo_dosah: { type: integer }
                presnost: { type: string }

    Trasa:
      type: object
      required: [type, features, spoje, meta]
      properties:
        type: { type: string, const: FeatureCollection }
        features:
          type: array
          description: Úseky všech spojů.
          items:
            type: object
            required: [type, geometry, properties]
            properties:
              type: { type: string, const: Feature }
              geometry: { $ref: '#/components/schemas/GeoLinie' }
              properties:
                type: object
                required: [spoj, usek, druh, od, do, odjezd, prijezd]
                properties:
                  spoj: { type: integer, description: Index spoje v poli `spoje`. }
                  usek: { type: integer }
                  druh: { type: string, enum: [WALK, BUS, RAIL, TRAM, TROLLEYBUS] }
                  linka: { type: [string, 'null'], example: '421' }
                  od: { type: string, example: 'Karlovy Vary, Tržnice' }
                  do: { type: string, example: 'Ostrov, aut. st.' }
                  odjezd: { $ref: '#/components/schemas/Cas' }
                  prijezd: { $ref: '#/components/schemas/Cas' }
                  chuze_m: { type: [integer, 'null'] }
        spoje:
          type: array
          maxItems: 3
          items:
            type: object
            required: [spoj, odjezd, prijezd, cas_min, prestupy]
            properties:
              spoj: { type: integer }
              odjezd: { $ref: '#/components/schemas/Cas' }
              prijezd: { $ref: '#/components/schemas/Cas' }
              cas_min: { type: integer }
              prestupy: { type: integer }
              chuze_m: { type: integer }
              rezerva_min: { type: integer, description: Čas mezi příjezdem a koncem okna scénáře. }
        meta:
          type: object
          properties:
            scenar: { type: string }
            okno_prijezdu: { type: array, items: { $ref: '#/components/schemas/Cas' } }
            den: { type: string, format: date }

    AnalyzaObce:
      type: object
      required: [type, features, meta]
      properties:
        type: { type: string, const: FeatureCollection }
        features:
          type: array
          items:
            type: object
            required: [type, geometry, properties]
            properties:
              type: { type: string, const: Feature }
              geometry: { $ref: '#/components/schemas/GeoPlocha' }
              properties:
                type: object
                required: [kod_obce, nazev, deti]
                properties:
                  kod_obce: { $ref: '#/components/schemas/KodObce' }
                  nazev: { type: string }
                  deti: { type: integer }
                  deti_bez_oboru: { type: integer, description: Jen s `obor`. }
                  podil_bez_oboru: { type: number, description: '% (jen s `obor`)' }
                  nejkratsi_cas_min: { type: [integer, 'null'], description: K nejbližší škole s oborem (bez `obor` s jakoukoli školou); null = bez spojení. }
                  pocet_oboru_v_dosahu: { type: integer, description: Jen bez `obor`. }
                  pocet_skol_v_dosahu: { type: integer }
                  deti_bez_skoly: { type: integer, description: Jen bez `obor`. }
        meta:
          allOf:
            - $ref: '#/components/schemas/MetaDosah'
            - type: object
              properties:
                obor: { type: [string, 'null'] }
                stupen: { type: [string, 'null'] }
                deti_celkem: { type: integer }
                deti_bez_oboru_celkem: { type: [integer, 'null'] }
                hranice: { type: array, items: { type: number }, description: Hranice tříd legendy. }

    BilanceOboru:
      type: object
      required: [kod, nazev, stupen, pocet_skol, kapacita, prihlasky, deti_v_dosahu, deti_bez_oboru, signaly]
      properties:
        kod: { $ref: '#/components/schemas/KodOboru' }
        nazev: { type: string, example: Kadeřník }
        stupen: { $ref: '#/components/schemas/Stupen' }
        pocet_skol: { type: integer, example: 3 }
        kapacita: { type: integer, example: 79 }
        prihlasky: { type: integer, example: 323 }
        prihlasky_na_misto: { type: [number, 'null'], example: 4.09 }
        index_pretlaku: { type: [number, 'null'], example: 1.54 }
        deti_v_dosahu: { type: integer }
        deti_bez_oboru: { type: integer }
        podil_deti_v_dosahu: { type: number, description: '%' }
        mist_na_100_deti: { type: [number, 'null'] }
        volna_mista: { type: [integer, 'null'], description: null = obor zatím nemá mapování na profese. }
        volna_mista_na_misto: { type: [number, 'null'] }
        signaly:
          type: array
          items: { $ref: '#/components/schemas/Signal' }

    SimulaceZsj:
      type: object
      required: [cas_min, deti, potencialni_uchazeci, novy_dosah]
      properties:
        cas_min: { type: integer, description: Doba dojezdu ze ZSJ ke škole. }
        deti: { type: integer }
        potencialni_uchazeci: { type: number, description: deti × podil_zajmu, zaokrouhleno na 1 desetinné místo. }
        novy_dosah: { type: boolean }
        nejblizsi_stavajici_min: { type: [integer, 'null'] }

    SimulaceSouhrn:
      type: object
      properties:
        zsj_v_dosahu: { type: integer }
        deti_v_dosahu: { type: integer }
        potencialni_uchazeci: { type: number }
        z_toho_novy_dosah: { type: number }
        blize_ke_skole: { type: number, description: Uchazeči ze ZSJ, kde je simulovaná škola blíž než každá stávající s oborem. }
        kapacita: { type: integer }
        uchazecu_na_misto: { type: number }

    SimulaceMeta:
      allOf:
        - $ref: '#/components/schemas/MetaDosah'
        - type: object
          properties:
            redizo: { $ref: '#/components/schemas/Redizo' }
            obor: { $ref: '#/components/schemas/KodOboru' }
            podil_zajmu: { type: number, example: 0.048 }
            skola_obor_uz_uci: { type: boolean }

    Simulace:
      type: object
      required: [zsj, souhrn, meta]
      properties:
        zsj:
          type: object
          description: Slovník kod_zsj → hodnoty.
          propertyNames: { $ref: '#/components/schemas/KodZsj' }
          additionalProperties: { $ref: '#/components/schemas/SimulaceZsj' }
        souhrn: { $ref: '#/components/schemas/SimulaceSouhrn' }
        meta: { $ref: '#/components/schemas/SimulaceMeta' }

    SimulaceGeojson:
      type: object
      required: [type, features, souhrn, meta]
      properties:
        type: { type: string, const: FeatureCollection }
        features:
          type: array
          items:
            type: object
            properties:
              type: { type: string, const: Feature }
              geometry: { $ref: '#/components/schemas/GeoPlocha' }
              properties:
                allOf:
                  - type: object
                    properties:
                      kod_zsj: { $ref: '#/components/schemas/KodZsj' }
                      nazev: { type: string }
                  - $ref: '#/components/schemas/SimulaceZsj'
        souhrn: { $ref: '#/components/schemas/SimulaceSouhrn' }
        meta: { $ref: '#/components/schemas/SimulaceMeta' }

    DetailOboru:
      type: object
      required: [obor, nabidky, obce_bez_oboru, kandidati, meta]
      properties:
        obor: { $ref: '#/components/schemas/BilanceOboru' }
        nabidky:
          type: array
          description: Školy, kde se obor učí.
          items:
            allOf:
              - $ref: '#/components/schemas/Nabidka'
              - type: object
                properties:
                  redizo: { $ref: '#/components/schemas/Redizo' }
                  nazev_skoly: { type: string }
                  deti_v_dosahu_skoly: { type: integer }
        obce_bez_oboru:
          type: array
          description: Seřazené podle počtu dětí sestupně.
          items:
            type: object
            properties:
              kod_obce: { $ref: '#/components/schemas/KodObce' }
              nazev: { type: string }
              deti: { type: integer }
              nejkratsi_cas_min: { type: [integer, 'null'] }
        kandidati:
          type: array
          description: Školy, které obor neučí, seřazené podle `nove_dosazene_deti`.
          items:
            type: object
            required: [redizo, nazev, nove_dosazene_deti, ma_pribuzny_obor]
            properties:
              redizo: { $ref: '#/components/schemas/Redizo' }
              nazev: { type: string }
              nove_dosazene_deti: { type: integer, description: Děti bez oboru, které by tuto školu stihly do `max_min`. }
              ma_pribuzny_obor: { type: boolean, description: Škola učí obor ze stejné skupiny KKOV. }
        trh_prace:
          type: ['object', 'null']
          description: null = obor zatím nemá mapování na profese.
          properties:
            volna_mista: { type: integer }
            profese:
              type: array
              items:
                type: object
                properties:
                  cz_isco: { type: string, example: '7231' }
                  nazev: { type: string }
                  pocet: { type: integer }
        meta: { $ref: '#/components/schemas/MetaDosah' }
