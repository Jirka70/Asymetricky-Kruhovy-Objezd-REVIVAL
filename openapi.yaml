openapi: 3.1.0
info:
  title: Obor na dosah API
  version: 3.1.0
  summary: Výběr střední školy podle dojezdu a plánování oborů v Karlovarském kraji.
  description: |
    API slouží dvěma částem aplikace:

    - **Pro rodiny** – student zadá, odkud cestuje, a uvidí, které školy s jeho oborem stihne ráno dojet a jakým spojem.
    - **Pro kraj** – úředník vidí na mapě, odkud je obor v dosahu, které obory jsou přeplněné nebo nedostupné
      a co by změnilo přidání oboru na konkrétní školu.

    API je jen pro čtení. Mapové vrstvy jsou GeoJSON (WGS 84, EPSG:4326).
    Studentské endpointy `/student/trasa` a `/student/skoly` volají OpenTripPlanner živě.
    Ostatní analytické endpointy čtou předpočítanou matici dojezdů ZSJ × škola.

    **Klíčové definice**

    | Pojem | Definice |
    | --- | --- |
    | `deti` | Odhad jednoho ročníku nastupujícího na SŠ v roce 2026: věková skupina 10–14 let ze SLDB 2021 v ZSJ, děleno 5. |
    | `cas_min` | Nejkratší spoj ze ZSJ k nejbližší škole s oborem (bez oboru k jakékoli SŠ), včetně chůze a přestupů. U obcí a ORP průměr ZSJ vážený počtem obyvatel. |
    | V dosahu | `cas_min` ≤ `max_min` (výchozí 120). |
    | `pasmo` | `do30`, `30_45`, `45_60`, `nad60` (60 až `max_min`), `mimo_dosah`, `bez_spojeni`, `data_nedostupna`. |
    | Děti bez oboru | Součet `deti` v ZSJ, kde obor v dosahu není. |
    | `prihlasky_na_misto` | Přihlášky / kapacita (přijímací řízení 2026, 1. kolo). |
    | `index_pretlaku` | `prihlasky_na_misto` / průměr kraje (2,66). 1,0 = průměr. |
    | `mist_na_100_deti` | 100 × kapacita oboru / děti, které mají obor v dosahu. |

    **Konvence**
    - Kódy (ZSJ, obec, ORP, REDIZO, obor) jsou vždy řetězce kvůli úvodním nulám.
    - Kód oboru obsahuje lomítko; v cestě se kóduje (`23-68-H%2F01`).
    - Neplatné identifikátory v cestě, včetně neplatného UTF-8 po dekódování, vrací JSON Chyba se stavem 422.
    - Nový scénář dojezdu = nový řádek v tabulce `SCENAR`, nový předpočet a nová hodnota ve výčtu `scenar`.
servers:
  - url: http://localhost:8000/api/v1
    description: Lokální vývoj (Rust / Axum)
tags:
  - name: Společné
    description: Školy a základní sídelní jednotky, používají obě části.
  - name: Pro rodiny
    description: Školy v dosahu z bodu a spojení do školy.
  - name: Pro kraj
    description: Mapa dostupnosti oboru, bilance oborů a simulace nového oboru.

paths:
  /skoly:
    get:
      tags: [Společné]
      operationId: listSkoly
      summary: Školy jako body na mapě
      description: Bez filtru vrátí všech 34 škol; 4 školy bez nabídky mají `pocet_nabidek` 0.
      parameters:
        - $ref: '#/components/parameters/OborFiltr'
        - $ref: '#/components/parameters/Stupen'
        - $ref: '#/components/parameters/Forma'
      responses:
        '500': { $ref: '#/components/responses/InterniChyba' }
        '503': { $ref: '#/components/responses/DatabazeNedostupna' }
        '200':
          description: GeoJSON bodů škol.
          content:
            application/geo+json:
              schema: { $ref: '#/components/schemas/SkolyFeatureCollection' }
        '422': { $ref: '#/components/responses/NeplatnyParametr' }

  /skoly/{redizo}:
    get:
      tags: [Společné]
      operationId: getSkola
      summary: Detail školy, její nabídka a spádová oblast
      description: |
        Spád zahrnuje ZSJ s konečným dojezdem do této školy v limitu max_min,
        nezávisle na tom, zda je jiná škola blíž. Scénář rano používá slot 07:00-08:00.
        Děti jsou populace 10–14 let ze SLDB 2021 dělená pěti, zaokrouhlená v každé ZSJ.
        Obce se řadí podle kódu; jejich děti jsou součet dosažitelných ZSJ a čas je
        nejkratší dojezd z těchto ZSJ. Limit se porovnává před zaokrouhlením časů.
        Bez dosažitelných ZSJ vrací deti_v_dosahu=0 a obce=[]. Uložené NULL časy
        znamenají neznámý dojezd a do spádu se nezapočítávají; chybějící řádky matice
        nebo demografie vrací 500. Detail i spád se čtou z jednoho konzistentního snímku.
      parameters:
        - name: redizo
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Redizo' }
          example: '600009084'
        - $ref: '#/components/parameters/MaxMin'
        - $ref: '#/components/parameters/Scenar'
      responses:
        '500': { $ref: '#/components/responses/InterniChyba' }
        '503': { $ref: '#/components/responses/DatabazeNedostupna' }
        '200':
          description: Detail školy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkolaDetail' }
        '404': { $ref: '#/components/responses/Nenalezeno' }
        '422': { $ref: '#/components/responses/NeplatnyParametr' }

  /student/skoly:
    get:
      tags: [Pro rodiny]
      operationId: listStudentSkoly
      summary: Školy seřazené podle doby dojezdu z bodu
      description: |
        Z databáze vybírá školy a nabídky, dojezdy počítá živě OpenTripPlanner ze zadaného bodu.
        Nejkratší z až 20 vrácených kandidátů s příjezdem v okně 07:00–08:00 (konec nezahrnut)
        Europe/Prague určuje čas, chůzi, přestupy a linky. Odjezd musí být ve stejný den.
        Den je nejbližší pracovní den s dosud neuplynulým oknem; lze nastavit OTP_SERVICE_DATE.
        Nejde o výběr podle fyzické vzdálenosti ani o garantované globální optimum.
        Bez oboru vrací jen školy v dosahu; s oborem všechny odpovídající školy, i bez spojení.
        Limit a řazení používají nezaokrouhlenou dobu, zobrazené cas_min jsou celé minuty.
        Shody rozhoduje název a REDIZO. Metadata počítají školy před filtrováním dle limitu.
        Platný výsledek bez vhodného spoje má spoj.stav=bez_spojeni. Chyba OTP vrací 502
        pro celou odpověď; nepoužívá se skrytý návrat k předpočtu. Bod mimo známé ZSJ vrací 422.
        Trasy se sdílejí s /student/trasa a cachují 24 hodin podle přesného bodu, školy a dne.
      parameters:
        - $ref: '#/components/parameters/Lat'
        - $ref: '#/components/parameters/Lon'
        - $ref: '#/components/parameters/OborFiltr'
        - $ref: '#/components/parameters/Forma'
        - $ref: '#/components/parameters/MaxMin'
        - $ref: '#/components/parameters/Scenar'
      responses:
        '502': { $ref: '#/components/responses/OtpNedostupne' }
        '500': { $ref: '#/components/responses/InterniChyba' }
        '503': { $ref: '#/components/responses/DatabazeNedostupna' }
        '200':
          description: Školy se spojem.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentSkoly' }
        '422': { $ref: '#/components/responses/NeplatnyParametr' }

  /student/trasa:
    get:
      tags: [Pro rodiny]
      operationId: getStudentTrasa
      summary: Spojení z bodu do školy na mapě (živě z OpenTripPlanneru)
      description: |
        Vrací až 3 spoje s příjezdem v okně scénáře, seřazené od nejkratšího.
        Každý úsek je GeoJSON `Feature` s geometrií `LineString`; úseky stejného spoje
        spojuje `properties.spoj`. Používá GTFS GraphQL planConnection a skutečnou geometrii OTP.
        Okno rano je 07:00–08:00 Europe/Prague, konec nezahrnut; odjezd ve stejný den.
        Nejbližší pracovní den s dosud neuplynulým oknem je uveden v meta.den;
        OTP_SERVICE_DATE umožňuje pevný den pro konkrétní jízdní řád. Neřeší školní prázdniny.
        Kandidáti se řadí podle nezaokrouhlené délky cesty, shody podle pozdějšího příjezdu.
        Bez vhodného spoje vrací prázdná pole features a spoje, nikoli chybu.
        Odpověď se cachuje 24 hodin podle přesného bodu, cílových souřadnic a dne.
        Chybějící jízdní řád pro den, chyba či neplatná odpověď OTP vrací 502.
        Neznámá škola vrací 404, bod mimo známé ZSJ 422.
      parameters:
        - $ref: '#/components/parameters/Lat'
        - $ref: '#/components/parameters/Lon'
        - name: redizo
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Redizo' }
          example: '600009084'
        - $ref: '#/components/parameters/Scenar'
      responses:
        '200':
          description: Spoje a jejich úseky.
          content:
            application/geo+json:
              schema: { $ref: '#/components/schemas/Trasa' }
        '500': { $ref: '#/components/responses/InterniChyba' }
        '503': { $ref: '#/components/responses/DatabazeNedostupna' }
        '404': { $ref: '#/components/responses/Nenalezeno' }
        '422': { $ref: '#/components/responses/NeplatnyParametr' }
        '502':
          description: OpenTripPlanner neodpověděl. Frontend může ukázat souhrn z `/student/skoly`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Chyba' }

  /zsj/seznam:
    get:
      tags: [Společné]
      operationId: listZsj
      summary: Seznam všech ZSJ s jejich polygony
      description: |
        Vrací všechny řádky tabulky `ZSJ` seřazené podle `kod`, bez filtrů a stránkování.
        `boundary` je uložený polygon převedený na GeoJSON geometrii ve WGS 84
        (EPSG:4326), se souřadnicemi v pořadí [lon, lat].
        `lat` a `lon` označují reprezentační bod uvnitř polygonu.
      responses:
        '500': { $ref: '#/components/responses/InterniChyba' }
        '503': { $ref: '#/components/responses/DatabazeNedostupna' }
        '200':
          description: Pole všech ZSJ; prázdná tabulka vrací prázdné pole.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ZsjZaznam' }

  /zsj:
    get:
      tags: [Pro kraj]
      operationId: getZsj
      summary: Mapa – odkud je obor v dosahu a za kolik minut
      description: |
        Doba dojezdu k nejbližší škole, která obor učí (bez `obor` k nejbližší jakékoli SŠ),
        pro plochy na zvolené úrovni:

        | `uroven` | Plochy |
        | --- | --- |
        | `orp` | 7 obvodů pojmenovaných podle největších měst (Aš, Cheb, Karlovy Vary, Kraslice, Mariánské Lázně, Ostrov, Sokolov) |
        | `obec` | obce kraje (výchozí) |
        | `zsj` | 839 základních sídelních jednotek |

        U `orp` a `obec` je `cas_min` průměr ZSJ vážený počtem obyvatel (ZSJ bez spojení se nepočítají).
        Aktuálně je implementováno pouze `uroven=zsj`; `obec` (i výchozí) a `orp` vracejí 501.
        `scenar=rano` používá matici s příjezdem 07:00–08:00. S `obor` se filtruje i `forma`;
        bez `obor` se počítají všechny SŠ. Shody dojezdu rozhoduje REDIZO.
        Limity a pásma používají původní minuty; `cas_min` se zaokrouhluje až pro zobrazení.
        `deti` je skupina 10–14 let z roku 2021 / 5, zaokrouhlená na celé děti po ZSJ.
        `deti_v_dosahu` je celý tento odhad nebo 0; podíl je 100 nebo 0 %, při nulovém odhadu 0 %.
        Bez odpovídající školy je pásmo `bez_spojeni`; bez známé doby k vybraným školám
        `data_nedostupna`. V obou případech chybí `cas_min` i `nejblizsi_redizo` a `v_dosahu=false`.
        Chybějící řádky matice nebo demografické vstupy vracejí 500.
        `meta.v_limitu` počítá plochy do 30, 45, 60 a `max_min` minut; limity jsou seřazené a bez duplicit.
      parameters:
        - $ref: '#/components/parameters/OborFiltr'
        - $ref: '#/components/parameters/Forma'
        - $ref: '#/components/parameters/Uroven'
        - $ref: '#/components/parameters/MaxMin'
        - $ref: '#/components/parameters/Scenar'
      responses:
        '501': { $ref: '#/components/responses/Neimplementovano' }
        '200':
          description: GeoJSON ploch s dobou dojezdu a pásmem.
          content:
            application/geo+json:
              schema: { $ref: '#/components/schemas/MapaDosahu' }
        '500': { $ref: '#/components/responses/InterniChyba' }
        '503': { $ref: '#/components/responses/DatabazeNedostupna' }
        '422': { $ref: '#/components/responses/NeplatnyParametr' }

  /obory:
    get:
      tags: [Pro kraj]
      operationId: listObory
      summary: Katalog oborů s nabídkou, přihláškami a poptávkou trhu práce
      description: |
        Vrací obory s alespoň jednou nabídkou ve zvolené formě studia; stupen filtruje úroveň vzdělání.
        Kapacita a přihlášky jsou součty všech odpovídajících nabídek, pocet_skol počítá různé REDIZO.
        Katalog neobsahuje demografické ani dojezdové výpočty. Parametry max_min a scenar se ignorují.
        Trh práce používá mapování NSP s vhodností 1 i 2 a vynechává místa vyžadující terciární vzdělání.
        Bez mapování jsou počty trhu práce null; s mapováním bez poptávky jsou 0.
        Více signálů se kombinuje jako OR. Poměry mají při nulové kapacitě hodnotu null.
        Číselné řazení ponechává null na konci v obou směrech; shody rozhoduje název a kód oboru.
      parameters:
        - $ref: '#/components/parameters/Stupen'
        - $ref: '#/components/parameters/Forma'
        - $ref: '#/components/parameters/MaxMin'
        - $ref: '#/components/parameters/Scenar'
        - name: signal
          in: query
          description: Jen obory s některým ze signálů pretlak, nizky_zajem, poptavka_trhu; více hodnot oddělit čárkou.
          schema: { type: string, pattern: '^(pretlak|nizky_zajem|poptavka_trhu)(,(pretlak|nizky_zajem|poptavka_trhu))*$', example: 'pretlak,poptavka_trhu' }
        - name: razeni
          in: query
          description: Pole pro řazení; mínus = sestupně.
          schema:
            type: string
            enum: [nazev, index_pretlaku, -index_pretlaku, volna_mista_na_misto, -volna_mista_na_misto]
            default: nazev
      responses:
        '500': { $ref: '#/components/responses/InterniChyba' }
        '503': { $ref: '#/components/responses/DatabazeNedostupna' }
        '200':
          description: Řádek za každý obor.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/OborPrehled' }
                  meta: { $ref: '#/components/schemas/OboryMeta' }
        '422': { $ref: '#/components/responses/NeplatnyParametr' }

  /obory/{kod}:
    get:
      tags: [Pro kraj]
      operationId: getObor
      summary: Detail oboru – nabídky, kandidátní školy a trh práce
      description: |
        Nabídky a kapacity zahrnují všechny formy studia. Školy se počítají podle různých REDIZO.
        Dojezd používá ranní matici 07:00–08:00 a původní minuty <= max_min.
        Děti jsou skupina 10–14 let z roku 2021 / 5, zaokrouhlená po ZSJ stejně jako u /zsj.
        Celkový dosah je sjednocení ZSJ všech škol s oborem; dosah každé nabídky je dosah její školy.
        Kandidáti obor neučí v žádné formě; nový dosah počítá děti bez známého stávajícího dosahu,
        které kandidátní školu do limitu stihnou. Shody rozhoduje název školy a REDIZO.
        Příbuzný obor má stejné první dvě číslice KKOV. Obec se zatím nevrací.
        NULL dojezdy se nepovažují za známý dosah, nejde o potvrzení absence spojení.
        Chybějící řádky matice nebo demografické vstupy vracejí 500.
        Poměry s nulovým jmenovatelem jsou null; při nulovém počtu dětí je podíl dosahu 0 %.
        Signály používají katalogové prahy; spatna_dostupnost znamená podíl dosahu < 50 %
        při kladném celkovém počtu dětí. Trh práce zahrnuje vhodnost 1/2 a vylučuje terciární vzdělání;
        bez mapování je trh_prace i počty trhu práce null, s mapováním bez poptávky jsou počty 0.
      parameters:
        - name: kod
          in: path
          required: true
          description: Kód oboru KKOV, lomítko kódované jako `%2F`.
          schema: { $ref: '#/components/schemas/KodOboru' }
          example: 18-20-M%2F01
        - $ref: '#/components/parameters/MaxMin'
        - $ref: '#/components/parameters/Scenar'
        - name: kandidatu
          in: query
          description: Kolik kandidátních škol vrátit.
          schema: { type: integer, minimum: 1, maximum: 34, default: 5 }
      responses:
        '200':
          description: Detail oboru.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailOboru' }
        '500': { $ref: '#/components/responses/InterniChyba' }
        '503': { $ref: '#/components/responses/DatabazeNedostupna' }
        '404': { $ref: '#/components/responses/Nenalezeno' }
        '422': { $ref: '#/components/responses/NeplatnyParametr' }

  /obory/{kod}/zamestnavatele:
    get:
      tags: [Pro kraj]
      operationId: listOborZamestnavatele
      summary: Zaměstnavatelé v kraji, kteří hledají profese související s oborem
      description: |
        Body pracovišť (IČO + adresa) s volnými místy v profesních skupinách CZ-ISCO,
        které jsou na obor navázané přes `OBOR_PROFESE` (mapování NSP). Odpověď na otázku
        „existuje k oboru zaměstnavatel?“ je `meta.existuje`.

        - Každé místo se počítá jednou (vazba obor–skupina je unikátní).
        - Pracoviště bez souřadnic z RÚIAN se nekreslí; jsou sečtená po obcích v `meta.bez_souradnic`.
        - U oborů bez mapování v NSP je `meta.mapovani: false` a `meta.existuje: null` (nevíme, ne „nikdo“).
      parameters:
        - name: kod
          in: path
          required: true
          description: Kód oboru KKOV, lomítko kódované jako `%2F`.
          schema: { $ref: '#/components/schemas/KodOboru' }
          example: 65-51-H%2F01
        - name: vhodnost
          in: query
          description: Nejhorší povolená vhodnost vazby z NSP – 1 jen nejvhodnější, 2 i vhodné.
          schema: { type: integer, enum: [1, 2], default: 2 }
        - name: jen_ss
          in: query
          description: Vynechat místa vyžadující vyšší odborné nebo vysokoškolské vzdělání (vyssOdbor, bakal, vysoka, doktor).
          schema: { type: boolean, default: true }
      responses:
        '500': { $ref: '#/components/responses/InterniChyba' }
        '503': { $ref: '#/components/responses/DatabazeNedostupna' }
        '200':
          description: GeoJSON bodů pracovišť.
          content:
            application/geo+json:
              schema: { $ref: '#/components/schemas/ZamestnavateleOboru' }
        '404': { $ref: '#/components/responses/Nenalezeno' }
        '422': { $ref: '#/components/responses/NeplatnyParametr' }

  /simulace:
    get:
      tags: [Pro kraj]
      operationId: getSimulace
      summary: Co kdyby škola učila obor s danou kapacitou
      description: |
        Výchozí formát je slovník `jednotky` podle kódu plochy (ZSJ, obce nebo ORP podle `uroven`)
        pro plochy se striktně kratším dojezdem, i pokud jsou stále nad `max_min`. Nic se neukládá.

        - `cas_min` = min(`cas_min_puvodni`, `cas_ke_skole`), `zlepseni_min` = rozdíl.
        - `potencialni_uchazeci` = `deti` × `podil_zajmu` (podíl oboru na všech přihláškách v kraji).
        - `novy_dosah` = plocha dnes obor do `max_min` nestihne.
        - `souhrn.v_limitu` = počet ploch do 30, 45, 60 a `max_min` minut před a po.

        S `format=geojson` vrátí celou mapu „S novým oborem“ ve stejném tvaru jako `/zsj`
        (všechny plochy, nezměněné se `zlepseni_min: 0`).
        Zatím jen pro stávající školy (`redizo`). Počítají se denní nabídky podle core_job_spec/simulace_oboru.py.
        Zájem = přihlášky na obor / všechny přihlášky na denní nabídky v kraji.
        Děti jsou nezaokrouhlený odhad 10–14 let / 5. Rozhodnutí používají původní doby dojezdu.
        NULL dojezd se v algoritmu bere jako nekonečno; chybějící řádek matice nebo demografie je chyba 500.
        Shody nejbližších škol rozhoduje menší REDIZO. ZSJ slovník obsahuje jen striktní zlepšení;
        přidání kapacity na existující školu přepočítá bilance i bez změn dojezdu.
        Pokud škola obor již učí a přihlášky / kapacita <= 2.66, vrátí se prázdný výstup,
        souhrn=null a meta.duvod=kapacita_staci (GeoJSON má prázdné features).
        Existující obor bez denních nabídek vrací 422; neznámá škola nebo obor 404.
        Souhrn přepočítá spád všech škol, odlehčení deficitních škol, přetažení od ostatních a nový dosah.
        Využití = (odlehčení + nový dosah) / přidaná kapacita. Verdikt je dobre_misto při využití >= 0.5,
        jinak spatne_misto při přetažení > odlehčení, jinak neutralni.
        Největší deficit je nejzápornější původní bilance mimo simulovanou školu.
        Obec/ORP: doby jsou průměry konečných časů vážené celou populací ZSJ ze SLDB 2021,
        při nulové váze je čas null. Děti a poptávka se sčítají přes všechny ZSJ plochy.
        Slovník obsahuje agregované plochy s alespoň jednou striktně zlepšenou ZSJ;
        souhrn počítá plochy zvolené úrovně, bilance a verdikt vždy používají jednotlivé ZSJ.
        Nový dosah agregované plochy znamená alespoň jednu nově dosaženou ZSJ.
        Zlepšení je rozdíl vážených průměrů, null pokud chybí původní čas; není to průměr změn ZSJ.
        GeoJSON geometrie obcí/ORP jsou sjednocení jejich ZSJ. Dojezdy se zobrazují na dvě desetinná místa,
        děti na jednu; zájem a souhrn mají stejné zaokrouhlení jako referenční implementace.
      parameters:
        - name: redizo
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Redizo' }
          example: '600009271'
        - name: obor
          in: query
          required: true
          description: Kód oboru KKOV.
          schema: { $ref: '#/components/schemas/KodOboru' }
          example: 18-20-M/01
        - name: kapacita
          in: query
          required: true
          description: Počet míst v prvním ročníku.
          schema: { type: integer, minimum: 1, maximum: 300 }
          example: 30
        - $ref: '#/components/parameters/Uroven'
        - $ref: '#/components/parameters/MaxMin'
        - $ref: '#/components/parameters/Scenar'
        - name: format
          in: query
          schema: { type: string, enum: [slovnik, geojson], default: slovnik }
      responses:
        '200':
          description: Výsledek simulace.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Simulace' }
              example:
                jednotky:
                  '555738': { nazev: Toužim, cas_ke_skole: 4, cas_min_puvodni: 52, cas_min: 4, zlepseni_min: 48,
                              pasmo: do30, pasmo_puvodni: '45_60', deti: 38, potencialni_uchazeci: 1.0, novy_dosah: false }
                souhrn:
                  jednotek_celkem: 100
                  v_limitu:
                    - { limit_min: 30, pred: 31, po: 38 }
                    - { limit_min: 45, pred: 46, po: 58 }
                    - { limit_min: 60, pred: 71, po: 76 }
                    - { limit_min: 120, pred: 94, po: 95 }
                  zlepsenych_jednotek: 12
                  prumerne_zkraceni_min: 18
                  potencialni_uchazeci: 41.2
                  blize_ke_skole: 17.5
                  kapacita: 30
                  uchazecu_na_misto: 1.37
                meta: { redizo: '600009271', obor: 18-20-M/01, uroven: obec, scenar: rano, max_min: 120,
                        podil_zajmu: 0.026, skola_obor_uz_uci: false }
            application/geo+json:
              schema: { $ref: '#/components/schemas/SimulaceGeojson' }
        '500': { $ref: '#/components/responses/InterniChyba' }
        '503': { $ref: '#/components/responses/DatabazeNedostupna' }
        '404': { $ref: '#/components/responses/Nenalezeno' }
        '422': { $ref: '#/components/responses/NeplatnyParametr' }

  /simulace/zmeny:
    post:
      tags:
      - Pro kraj
      operationId: postSimulaceZmeny
      summary: Simulace více změn kapacity jednoho oboru
      description: 'Pouze čtení: všechny změny denního oboru se aplikují současně na jeden konzistentní
        snímek databáze. Změny stejné školy se nejprve sečtou; kontroluje se výsledná nezáporná kapacita.
        Každá položka je nenulová změna od -300 do 300 míst; maximálně 100 položek. Výsledná nulová kapacita
        vyřazuje školu ze simulované nabídky, včetně původních nulových nabídek. Lze odebrat i poslední
        nabídku. Původní stav zahrnuje všechny uložené denní nabídky.


        Zájem je podíl přihlášek tohoto oboru mezi všemi denními přihláškami před změnami. Děti jsou populace
        10–14 let / 5, bez předčasného zaokrouhlení. Spád přiřazuje ZSJ nejbližší škole v max_min (shody
        rozhoduje REDIZO); kapacita neomezuje přidělení, bilance je kapacita minus spád. Částečné snížení
        při kladné zbývající kapacitě mění bilanci, nikoli dojezd. Přesuny uchazečů jsou změny spádové školy,
        nikoli simulace přijímacího řízení; null označuje stav mimo dosah.


        Slovník obsahuje jednotky s odlišným dojezdem nebo nejbližší školou, včetně zhoršení. GeoJSON obsahuje
        celou vrstvu. Časy obcí a ORP jsou populačně vážené průměry konečných časů ZSJ. Příznaky zlepšení,
        zhoršení, nového a ztraceného dosahu znamenají alespoň jednu odpovídající ZSJ; smíšená jednotka
        může mít více příznaků. zlepseni_min je původní minus nový čas (zhoršení záporné), null při neznámém
        čase. Počty jednotek a průměrné změny odpovídají požadované úrovni; součty dětí, spád a přesuny
        se počítají z jednotlivých ZSJ. Průměrné změny vynechávají neznámé časy. Údaje jsou zaokrouhleny
        až při výstupu.


        Chybějící řádky dojezdů nebo demografie způsobí 500; uložený null dojezdu je platný neznámý dojezd.
        Neznámý obor nebo škola vrací 404, obor bez denních nabídek nebo záporná výsledná kapacita 422.
        Původní GET /simulace má vlastní nezměněný kontrakt.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchSimulaceRequest'
            example:
              obor: 23-68-H/01
              zmeny:
              - redizo: '600009084'
                zmena_kapacity: -30
              - redizo: '600009271'
                zmena_kapacity: 30
              max_min: 120
              scenar: rano
              uroven: obec
              format: slovnik
      responses:
        '200':
          description: Dopady společného scénáře před a po změnách.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchSimulace'
            application/geo+json:
              schema:
                $ref: '#/components/schemas/BatchSimulaceGeojson'
        '404':
          $ref: '#/components/responses/Nenalezeno'
        '422':
          $ref: '#/components/responses/NeplatnyParametr'
        '500':
          $ref: '#/components/responses/InterniChyba'
        '503':
          $ref: '#/components/responses/DatabazeNedostupna'

components:
  parameters:
    Lat:
      name: lat
      in: query
      required: true
      description: Zeměpisná šířka výchozího bodu (WGS 84). Bod musí ležet v Karlovarském kraji.
      schema: { type: number, minimum: 49.9, maximum: 50.5 }
      example: 50.2312
    Lon:
      name: lon
      in: query
      required: true
      description: Zeměpisná délka výchozího bodu (WGS 84).
      schema: { type: number, minimum: 12.0, maximum: 13.4 }
      example: 12.8711
    MaxMin:
      name: max_min
      in: query
      description: Nejdelší přijatelná doba dojezdu v minutách.
      schema: { type: integer, minimum: 10, maximum: 180, default: 120 }
    Scenar:
      name: scenar
      in: query
      description: |
        Scénář dojezdu („Příchod do školy“). Hodnoty odpovídají předpočítaným scénářům v tabulce `SCENAR`;
        dnes jen `rano` = příjezd 7:00–8:00 v běžný školní den.
      schema: { type: string, enum: [rano], default: rano }
    Uroven:
      name: uroven
      in: query
      description: Velikost ploch mapy – `orp` (7 obvodů největších měst), `obec`, `zsj`.
      schema: { type: string, enum: [orp, obec, zsj], default: obec }
    OborFiltr:
      name: obor
      in: query
      description: Kód oboru KKOV (v query není třeba lomítko kódovat).
      schema: { $ref: '#/components/schemas/KodOboru' }
      example: 18-20-M/01
    Stupen:
      name: stupen
      in: query
      description: Stupeň vzdělání (písmeno v kódu KKOV); více hodnot oddělit čárkou.
      schema: { type: string, pattern: '^[CEHKLM](,[CEHKLM])*$' }
      example: M
    Forma:
      name: forma
      in: query
      description: Forma vzdělávání.
      schema: { type: string, enum: [den, dal], default: den }

  responses:
    OtpNedostupne:
      description: OpenTripPlanner je nedostupný, vrátil neplatná data nebo nemá jízdní řád pro den.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Chyba' }
    InterniChyba:
      description: Nepodařilo se načíst data nebo uložená data neodpovídají požadovanému formátu.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Chyba' }
    DatabazeNedostupna:
      description: Databázové připojení je dočasně nedostupné.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Chyba' }
    Neimplementovano:
      description: Endpoint je zatím pouze stub; jeho aplikační logika není implementovaná.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Chyba' }
    Nenalezeno:
      description: Záznam neexistuje.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Chyba' }
          example:
            error: { kod: nenalezeno, zprava: 'Škola 600000000 neexistuje.', pole: redizo }
    NeplatnyParametr:
      description: Neplatný parametr (neznámý obor nebo scénář, bod mimo kraj…).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Chyba' }
          example:
            error: { kod: mimo_kraj, zprava: 'Bod neleží v Karlovarském kraji.', pole: lat }

  schemas:
    KodZsj: { type: string, pattern: '^\d{6}$', example: '063622' }
    KodObce: { type: string, pattern: '^\d{6}$', example: '554961' }
    KodPlochy: { type: string, pattern: '^\d{4,6}$', description: Kód ZSJ, obce nebo ORP podle `uroven`. }
    Redizo: { type: string, pattern: '^\d{9}$', example: '600009084' }
    KodOboru: { type: string, pattern: '^\d{2}-\d{2}-[A-Z]/\d{2}$', example: 18-20-M/01 }
    Stupen:
      type: string
      enum: [C, E, H, K, L, M]
      description: C praktická škola, E praktické obory, H výuční list, K gymnázium, L maturita s praxí / nástavba, M maturita.
    Signal:
      type: string
      enum: [pretlak, nizky_zajem, spatna_dostupnost, poptavka_trhu]
    Pasmo:
      type: string
      enum: [do30, '30_45', '45_60', nad60, mimo_dosah, bez_spojeni, data_nedostupna]
    Cas:
      type: string
      pattern: '^\d{2}:\d{2}$'
      example: '07:41'

    Chyba:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [kod, zprava]
          properties:
            kod: { type: string }
            zprava: { type: string }
            pole: { type: [string, 'null'] }

    MetaDosah:
      type: object
      required: [scenar, max_min]
      properties:
        scenar: { type: string, example: rano }
        max_min: { type: integer, example: 120 }

    MetaBilance:
      allOf:
        - $ref: '#/components/schemas/MetaDosah'
        - type: object
          properties:
            deti_celkem: { type: integer }
            prumer_prihlasek_na_misto: { type: number, example: 2.66 }
            prijimaci_rizeni:
              type: object
              properties:
                rok: { type: integer, example: 2026 }
                kolo: { type: integer, example: 1 }
            prahy:
              type: object
              properties:
                pretlak: { type: number, example: 1.5 }
                nizky_zajem: { type: number, example: 0.5 }
                spatna_dostupnost: { type: number, example: 50 }
                poptavka_trhu: { type: number, example: 2 }

    VLimitu:
      type: object
      required: [limit_min, jednotek]
      properties:
        limit_min: { type: integer, example: 45 }
        jednotek: { type: integer, example: 46 }

    VLimituPredPo:
      type: object
      required: [limit_min, pred, po]
      properties:
        limit_min: { type: integer, example: 45 }
        pred: { type: integer, example: 46 }
        po: { type: integer, example: 58 }

    Nabidka:
      type: object
      required: [kod_oboru, nazev_oboru, forma, kapacita, prihlasky]
      properties:
        kod_oboru: { $ref: '#/components/schemas/KodOboru' }
        nazev_oboru: { type: string }
        zamereni: { type: [string, 'null'] }
        stupen: { $ref: '#/components/schemas/Stupen' }
        forma: { type: string, enum: [den, dal] }
        delka_let: { type: integer, example: 3 }
        kapacita: { type: integer, example: 30 }
        prihlasky: { type: integer, example: 131 }
        prihlasky_na_misto: { type: [number, 'null'], example: 4.37 }
        index_pretlaku: { type: [number, 'null'], example: 1.64 }

    ZsjZaznam:
      type: object
      required: [kod, nazev, lat, lon, boundary, kod_obce]
      properties:
        kod: { $ref: '#/components/schemas/KodZsj' }
        nazev: { type: string, example: Abertamy }
        lat: { type: number, description: Zeměpisná šířka reprezentačního bodu (WGS 84). }
        lon: { type: number, description: Zeměpisná délka reprezentačního bodu (WGS 84). }
        boundary:
          allOf:
            - $ref: '#/components/schemas/GeoPlocha'
            - type: object
              properties:
                type: { type: string, const: Polygon }
          description: Polygon z tabulky `ZSJ` jako GeoJSON geometrie.
        kod_obce:
          oneOf:
            - $ref: '#/components/schemas/KodObce'
            - type: 'null'

    GeoPoint:
      type: object
      required: [type, coordinates]
      properties:
        type: { type: string, const: Point }
        coordinates: { type: array, minItems: 2, maxItems: 2, items: { type: number }, example: [12.95214, 50.30477] }
    GeoPlocha:
      type: object
      required: [type, coordinates]
      properties:
        type: { type: string, enum: [Polygon, MultiPolygon] }
        coordinates: { type: array, items: {} }
    GeoLinie:
      type: object
      required: [type, coordinates]
      properties:
        type: { type: string, const: LineString }
        coordinates:
          type: array
          items: { type: array, minItems: 2, maxItems: 2, items: { type: number } }

    SkolyFeatureCollection:
      type: object
      required: [type, features]
      properties:
        type: { type: string, const: FeatureCollection }
        features:
          type: array
          items:
            type: object
            required: [type, geometry, properties]
            properties:
              type: { type: string, const: Feature }
              geometry: { $ref: '#/components/schemas/GeoPoint' }
              properties:
                type: object
                required: [redizo, nazev, pocet_nabidek]
                properties:
                  redizo: { $ref: '#/components/schemas/Redizo' }
                  nazev: { type: string }
                  obec: { type: string, example: Ostrov }
                  pocet_nabidek: { type: integer, example: 8 }
                  kapacita: { type: integer, example: 240 }
                  prihlasky: { type: integer, example: 724 }
                  index_pretlaku: { type: [number, 'null'], example: 1.14 }

    SkolaDetail:
      type: object
      required: [redizo, nazev, lat, lon, nabidky, spadovost]
      properties:
        redizo: { $ref: '#/components/schemas/Redizo' }
        nazev: { type: string }
        adresa: { type: string, example: 'Klínovecká 1197, 36301 Ostrov' }
        web: { type: [string, 'null'], format: uri }
        lat: { type: number }
        lon: { type: number }
        nabidky:
          type: array
          items: { $ref: '#/components/schemas/Nabidka' }
        spadovost:
          type: object
          description: Odkud se do školy dá dojet do `max_min`.
          properties:
            deti_v_dosahu: { type: integer }
            obce:
              type: array
              items:
                type: object
                properties:
                  kod_obce: { $ref: '#/components/schemas/KodObce' }
                  nazev: { type: string }
                  deti: { type: integer }
                  nejkratsi_cas_min: { type: integer }
        meta: { $ref: '#/components/schemas/MetaDosah' }

    Spoj:
      type: object
      required: [stav]
      properties:
        stav: { type: string, enum: [ok, bez_spojeni, data_nedostupna], description: bez_spojeni znamená platný výsledek OTP bez vhodného spoje; data_nedostupna je vyhrazeno neznámým historickým údajům. }
        odjezd: { oneOf: [{ $ref: '#/components/schemas/Cas' }, { type: 'null' }] }
        prijezd: { oneOf: [{ $ref: '#/components/schemas/Cas' }, { type: 'null' }] }
        cas_min: { type: [integer, 'null'], example: 36 }
        prestupy: { type: [integer, 'null'], example: 0 }
        chuze_m: { type: [integer, 'null'], example: 540 }
        vzdalenost_m: { type: [integer, 'null'], description: Celková vzdálenost všech úseků OTP v metrech. }
        linky: { type: array, items: { type: string }, example: ['421'] }

    StudentSkoly:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            type: object
            required: [redizo, nazev, lat, lon, v_dosahu, spoj, nabidky]
            properties:
              redizo: { $ref: '#/components/schemas/Redizo' }
              nazev: { type: string }
              lat: { type: number }
              lon: { type: number }
              v_dosahu: { type: boolean }
              spoj: { $ref: '#/components/schemas/Spoj' }
              nabidky:
                type: array
                description: S filtrem `obor` jen nabídky tohoto oboru, jinak všechny.
                items: { $ref: '#/components/schemas/Nabidka' }
        meta:
          allOf:
            - $ref: '#/components/schemas/MetaDosah'
            - type: object
              properties:
                zsj: { $ref: '#/components/schemas/KodZsj' }
                v_dosahu: { type: integer }
                mimo_dosah: { type: integer }
                presnost: { type: string }
                den: { type: string, format: date }

    Trasa:
      type: object
      required: [type, features, spoje, meta]
      properties:
        type: { type: string, const: FeatureCollection }
        features:
          type: array
          description: Úseky všech spojů.
          items:
            type: object
            required: [type, geometry, properties]
            properties:
              type: { type: string, const: Feature }
              geometry: { $ref: '#/components/schemas/GeoLinie' }
              properties:
                type: object
                required: [spoj, usek, druh, od, do, odjezd, prijezd]
                properties:
                  spoj: { type: integer, description: Index spoje v poli `spoje`. }
                  usek: { type: integer }
                  druh: { type: string, enum: [WALK, BUS, RAIL, TRAM, TROLLEYBUS] }
                  linka: { type: [string, 'null'], example: '421' }
                  od: { type: string, example: 'Karlovy Vary, Tržnice' }
                  do: { type: string, example: 'Ostrov, aut. st.' }
                  odjezd: { $ref: '#/components/schemas/Cas' }
                  prijezd: { $ref: '#/components/schemas/Cas' }
                  chuze_m: { type: [integer, 'null'] }
        spoje:
          type: array
          maxItems: 3
          items:
            type: object
            required: [spoj, odjezd, prijezd, cas_min, prestupy]
            properties:
              spoj: { type: integer }
              odjezd: { $ref: '#/components/schemas/Cas' }
              prijezd: { $ref: '#/components/schemas/Cas' }
              cas_min: { type: integer }
              prestupy: { type: integer }
              chuze_m: { type: integer }
              vzdalenost_m: { type: integer, description: Celková vzdálenost všech úseků OTP v metrech. }
              rezerva_min: { type: integer, description: Čas mezi příjezdem a koncem okna scénáře. }
        meta:
          type: object
          properties:
            scenar: { type: string }
            okno_prijezdu: { type: array, items: { $ref: '#/components/schemas/Cas' } }
            den: { type: string, format: date }

    PlochaDosahu:
      type: object
      required: [kod, nazev, uroven, pasmo, v_dosahu, deti]
      properties:
        kod: { $ref: '#/components/schemas/KodPlochy' }
        nazev: { type: string, example: Karlovy Vary }
        uroven: { type: string, enum: [orp, obec, zsj] }
        cas_min: { type: [integer, 'null'], example: 24, description: Chybí nebo null při neznámém dojezdu. }
        pasmo: { $ref: '#/components/schemas/Pasmo' }
        v_dosahu: { type: boolean }
        deti: { type: integer, example: 412 }
        deti_v_dosahu: { type: integer, example: 412 }
        podil_deti_v_dosahu: { type: number, example: 100.0, description: '%' }
        nejblizsi_redizo: { type: [string, 'null'], example: '600009084' }

    MapaDosahu:
      type: object
      required: [type, features, meta]
      properties:
        type: { type: string, const: FeatureCollection }
        features:
          type: array
          items:
            type: object
            required: [type, geometry, properties]
            properties:
              type: { type: string, const: Feature }
              geometry: { $ref: '#/components/schemas/GeoPlocha' }
              properties: { $ref: '#/components/schemas/PlochaDosahu' }
        meta:
          allOf:
            - $ref: '#/components/schemas/MetaDosah'
            - type: object
              properties:
                obor: { type: [string, 'null'] }
                forma: { type: string }
                uroven: { type: string, enum: [orp, obec, zsj] }
                jednotek_celkem: { type: integer, example: 100 }
                v_limitu:
                  type: array
                  items: { $ref: '#/components/schemas/VLimitu' }

    OborPrehled:
      type: object
      required: [kod, nazev, stupen, pocet_skol, kapacita, prihlasky, prihlasky_na_misto, index_pretlaku, zamestnavatelu, volna_mista, volna_mista_na_misto, signaly]
      properties:
        kod: { $ref: '#/components/schemas/KodOboru' }
        nazev: { type: string }
        stupen: { $ref: '#/components/schemas/Stupen' }
        pocet_skol: { type: integer }
        kapacita: { type: integer }
        prihlasky: { type: integer }
        prihlasky_na_misto: { type: [number, 'null'], description: Přihlášky / kapacita; null při nulové kapacitě. }
        index_pretlaku: { type: [number, 'null'], description: Přihlášky na místo / 2.66. }
        zamestnavatelu: { type: [integer, 'null'], description: Různá IČO s odpovídající poptávkou; null bez mapování NSP. }
        volna_mista: { type: [integer, 'null'], description: Součet odpovídajících míst; null bez mapování NSP. }
        volna_mista_na_misto: { type: [number, 'null'], description: Volná pracovní místa / kapacita; null bez mapování nebo při nulové kapacitě. }
        signaly:
          type: array
          items: { type: string, enum: [pretlak, nizky_zajem, poptavka_trhu] }

    OboryMeta:
      type: object
      required: [prumer_prihlasek_na_misto, prijimaci_rizeni, prahy]
      properties:
        prumer_prihlasek_na_misto: { type: number, example: 2.66 }
        prijimaci_rizeni:
          type: object
          properties:
            rok: { type: integer, example: 2026 }
            kolo: { type: integer, example: 1 }
        prahy:
          type: object
          required: [pretlak, nizky_zajem, poptavka_trhu]
          properties:
            pretlak: { type: number, example: 1.5, description: index_pretlaku >= pretlak. }
            nizky_zajem: { type: number, example: 0.5, description: index_pretlaku <= nizky_zajem. }
            poptavka_trhu: { type: number, example: 2, description: volna_mista_na_misto >= poptavka_trhu. }

    BilanceOboru:
      type: object
      required: [kod, nazev, stupen, pocet_skol, kapacita, prihlasky, deti_v_dosahu, deti_bez_oboru, signaly]
      properties:
        kod: { $ref: '#/components/schemas/KodOboru' }
        nazev: { type: string, example: Informační technologie }
        stupen: { $ref: '#/components/schemas/Stupen' }
        pocet_skol: { type: integer, example: 3 }
        kapacita: { type: integer, example: 90 }
        prihlasky: { type: integer, example: 248 }
        prihlasky_na_misto: { type: [number, 'null'], example: 2.76 }
        index_pretlaku: { type: [number, 'null'], example: 1.04 }
        deti_v_dosahu: { type: integer }
        deti_bez_oboru: { type: integer }
        podil_deti_v_dosahu: { type: number, description: '%' }
        mist_na_100_deti: { type: [number, 'null'] }
        zamestnavatelu: { type: [integer, 'null'], description: Různá IČO s místy v souvisejících profesích; null = obor nemá mapování v NSP. }
        volna_mista: { type: [integer, 'null'], description: null = obor nemá mapování v NSP (nikdy 0 místo null). }
        volna_mista_na_misto: { type: [number, 'null'] }
        signaly:
          type: array
          items: { $ref: '#/components/schemas/Signal' }

    DetailOboru:
      type: object
      required: [obor, nabidky, kandidati, meta]
      properties:
        obor: { $ref: '#/components/schemas/BilanceOboru' }
        nabidky:
          type: array
          description: Školy, kde se obor učí.
          items:
            allOf:
              - $ref: '#/components/schemas/Nabidka'
              - type: object
                properties:
                  redizo: { $ref: '#/components/schemas/Redizo' }
                  nazev_skoly: { type: string }
                  deti_v_dosahu_skoly: { type: integer }
        kandidati:
          type: array
          description: Školy, které obor neučí, seřazené podle `nove_dosazene_deti`. Plní výběr „Kandidátní škola“.
          items:
            type: object
            required: [redizo, nazev, nove_dosazene_deti, ma_pribuzny_obor]
            properties:
              redizo: { $ref: '#/components/schemas/Redizo' }
              nazev: { type: string }
              obec: { type: string }
              nove_dosazene_deti: { type: integer, description: Děti, které dnes obor do `max_min` nestihnou a tuto školu ano. }
              ma_pribuzny_obor: { type: boolean, description: Škola učí obor ze stejné skupiny KKOV. }
        trh_prace:
          type: ['object', 'null']
          description: null = obor zatím nemá mapování na profese.
          properties:
            volna_mista: { type: integer }
            zamestnavatelu: { type: integer }
            profese:
              type: array
              items:
                type: object
                properties:
                  cz_isco3: { type: string, example: '512' }
                  vhodnost: { type: integer, enum: [1, 2] }
                  nazev: { type: string }
                  pocet: { type: integer }
        meta: { $ref: '#/components/schemas/MetaDosah' }

    ZamestnavateleOboru:
      type: object
      required: [type, features, meta]
      properties:
        type: { type: string, const: FeatureCollection }
        features:
          type: array
          items:
            type: object
            required: [type, geometry, properties]
            properties:
              type: { type: string, const: Feature }
              geometry: { $ref: '#/components/schemas/GeoPoint' }
              properties:
                type: object
                required: [id, ico, nazev, kod_obce, pocet_mist, profese]
                properties:
                  id: { type: string, description: 'ID pracoviště (63bitové číslo jako řetězec, JavaScript ho jako číslo nepřečte přesně).', example: '84980608601418621' }
                  ico: { type: string, pattern: '^\d{8}$', example: '21124311' }
                  nazev: { type: string, example: Linhart Gastro s.r.o. }
                  kod_obce: { $ref: '#/components/schemas/KodObce' }
                  pocet_mist: { type: integer, example: 1 }
                  profese:
                    type: array
                    items:
                      type: object
                      properties:
                        cz_isco3: { type: string, example: '512' }
                        nazev: { type: string }
                        vhodnost: { type: integer, enum: [1, 2] }
                        pocet_mist: { type: integer }
        meta:
          type: object
          required: [obor, mapovani, existuje]
          properties:
            obor: { $ref: '#/components/schemas/KodOboru' }
            mapovani: { type: boolean, description: false = obor nemá v NSP vazbu na žádnou profesní skupinu. }
            existuje: { type: [boolean, 'null'], description: null = obor nemá mapování. }
            zamestnavatelu: { type: [integer, 'null'], description: 'Počet různých IČO.', example: 84 }
            pracovist: { type: [integer, 'null'], example: 91 }
            pocet_mist: { type: [integer, 'null'], example: 266 }
            bez_souradnic:
              type: array
              items:
                type: object
                properties:
                  kod_obce: { $ref: '#/components/schemas/KodObce' }
                  pracovist: { type: integer }
                  pocet_mist: { type: integer }
            skupiny:
              type: array
              items:
                type: object
                properties:
                  cz_isco3: { type: string }
                  nazev: { type: string }
                  vhodnost: { type: integer, enum: [1, 2] }
            importovano: { type: string, format: date-time }

    SimulacePlocha:
      type: object
      required: [nazev, cas_ke_skole, cas_min, zlepseni_min, pasmo, deti, potencialni_uchazeci, novy_dosah]
      properties:
        nazev: { type: string }
        cas_ke_skole: { type: [number, 'null'], description: Dojezd k simulované škole. }
