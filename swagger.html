<script>
const spec = {
  "openapi": "3.1.0",
  "info": {
    "title": "Obor na dosah API",
    "version": "1.0.0",
    "summary": "Data o demografii, ZSJ, středních školách, oborech a dojezdech v Karlovarském kraji.",
    "description": "API je jen pro čtení. Vrací JSON a pro mapové vrstvy GeoJSON (WGS 84, EPSG:4326,\nsouřadnice zaokrouhlené na 5 desetinných míst).\n\n**Zdroje dat**\n- ZSJ: `public.\"ZSJ\"` (839 základních sídelních jednotek, polygony `boundary`).\n- Demografie: `DATA_DEMOGRAFIE_ZSJ` – modelový odhad věkové struktury k 26. 3. 2021\n  (SLDB 2021), bez rozlišení pohlaví.\n- Školy: `stredni_skoly` (34 škol, 30 z nich s nabídkou v 1. kole 2026).\n- Obory a nabídky: `OBORY`, `NABIDKA_OBORU` (81 oborů, 140 nabídek, přijímací řízení 2026, 1. kolo).\n- Dojezdy: předpočítaná matice ZSJ × škola z OpenTripPlanneru (scénář příjezd 7:30–8:00\n  v běžný školní den). Živě se OTP volá jen v `/dojezdy/trasa`.\n\n**Konvence**\n- Kódy (ZSJ, obec, REDIZO, obor) jsou vždy řetězce, aby se neztratily úvodní nuly.\n- Více hodnot v jednom parametru se odděluje čárkou.\n- Kód oboru obsahuje lomítko (`79-41-K/41`); v cestě se kóduje jako `79-41-K%2F41`.\n- Věkové rozsahy musí sledovat 5leté skupiny ČSÚ (`vek_od` násobek 5, `vek_do` = násobek 5 minus 1).\n",
    "contact": {
      "name": "Carlsbad open data hackathon"
    }
  },
  "servers": [
    {
      "url": "http://localhost:8000/api/v1",
      "description": "Lokální vývoj (uvicorn)"
    }
  ],
  "tags": [
    {
      "name": "Číselníky",
      "description": "Data, která frontend načte jednou při startu."
    },
    {
      "name": "ZSJ a demografie",

    {
      "name": "Školy a obory",

              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "data"
                  ],
                  "properties": {
                    "data": {
                      "type": "array",
                      "items": {
                        "$ref": "#/components/schemas/VekovaSkupina"
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    },

            "description": "Hledání v názvu oboru (bez ohledu na velikost písmen a diakritiku).",

              "type": "string",
              "minLength": 2
            },
            "example": "mechanik"

          {
            "$ref": "#/components/parameters/Forma"
          },
          {
            "$ref": "#/components/parameters/Stupen"
          },
          {
            "name": "skupina",
            "in": "query",
            "description": "Skupina oborů KKOV (první dvojčíslí kódu), např. `23` = strojírenství.",

                "schema": {
                  "type": "object",
                  "required": [

                  ],
                  "properties": {
                    "data": {
                      "type": "array",
                      "items": {
                        "$ref": "#/components/schemas/Obor"
                      }
                    },
                    "meta": {
                      "$ref": "#/components/schemas/MetaPrijimaciRizeni"
                    }
                  }
                }
              }
            }
          },
          "422": {
            "$ref": "#/components/responses/NeplatnyParametr"
          }
        }
      }
    },

        "tags": [
          "Školy a obory"

              "application/json": {

              }
            }
          },
          "404": {
            "$ref": "#/components/responses/NenalezenoResponse"
          }
        }
      }
    },
    "/obce": {

                }

            }
          }
        }

    },

              "application/json": {

                        "$ref": "#/components/schemas/ZsjVlastnosti"

    "/zsj/{kod_zsj}": {

          {

    "/demografie": {
      "get": {
        "tags": [
          "ZSJ a demografie"
        ],
        "operationId": "getDemografie",
        "summary": "Věková struktura za ZSJ, obec nebo kraj",
        "parameters": [
          {
            "name": "uroven",
            "in": "query",
            "required": true,

                "obec",
                "kraj"
              ]

          },
          {
            "name": "kod",

            "example": "554961"

          {
            "$ref": "#/components/parameters/Rok"

          {
            "$ref": "#/components/parameters/VekDo"

        "responses": {
          "200": {
            "description": "Populace po věkových skupinách.",

                "schema": {
                  "$ref": "#/components/schemas/Demografie"
                },
                "example": {
                  "uroven": "obec",
                  "kod": "554961",
                  "rok": 2021,
                  "populace": 44323,
                  "data": [
                    {
                      "skupina": "1300150019",
                      "popis": "15-19",
                      "vek_od": 15,
                      "vek_do": 19,
                      "populace": 1814
                    }
                  ],
                  "meta": {
                    "odhad": true,
                    "zdroj": "SLDB 2021, modelový odhad",
                    "rozhodne_datum": "2021-03-26"
                  }
                }
              }
            }
          },
          "404": {
            "$ref": "#/components/responses/NenalezenoResponse"
          },
          "422": {
            "$ref": "#/components/responses/NeplatnyParametr"
          }
        }
      }
    },
    "/demografie/mapa": {
      "get": {
        "tags": [
          "ZSJ a demografie"
        ],
        "operationId": "getDemografieMapa",
        "summary": "Choropleth ZSJ podle zvoleného věkového pásma",
        "description": "Vrací ZSJ jako GeoJSON s vlastností `hodnota` podle `ukazatel`.\nU `podil` mají ZSJ s méně než 20 obyvateli `hodnota: null`.\n`meta.hranice` obsahuje hranice tříd (kvantily) pro legendu.\n",
        "parameters": [
          {
            "$ref": "#/components/parameters/VekOd"
          },
          {
            "$ref": "#/components/parameters/VekDo"
          },
          {
            "name": "ukazatel",
            "in": "query",
            "schema": {
              "type": "string",
              "enum": [
                "pocet",
                "podil",
                "hustota"
              ],
              "default": "pocet"
            },
            "description": "`pocet` – lidé ve zvoleném věku; `podil` – jejich podíl na populaci ZSJ v %;\n`hustota` – lidé ve zvoleném věku na km².\n"
          },
          {
            "name": "tridy",
            "in": "query",
            "description": "Počet tříd legendy.",
            "schema": {
              "type": "integer",
              "minimum": 3,
              "maximum": 9,
              "default": 5

          {
            "$ref": "#/components/parameters/Obec"
          },
          {
            "$ref": "#/components/parameters/Bbox"
          },
          {
            "$ref": "#/components/parameters/Zjednoduseni"

          {
            "$ref": "#/components/parameters/Rok"

          }
        }

          {

    "/dojezdy/trasa": {
      "get": {
        "tags": [
          "Dojezdy"
        ],
        "operationId": "getDojezdTrasa",
        "summary": "Jedno konkrétní spojení (živě z OpenTripPlanneru)",
        "description": "Jediný endpoint, který volá OTP živě. Odpověď se cachuje 24 hodin podle souřadnic\nzaokrouhlených na 3 desetinná místa (≈ 100 m).\n",

              "$ref": "#/components/schemas/LatLon"
            },
            "example": "50.23,12.87"
          },
          {
            "name": "redizo",
            "in": "query",
            "required": true,
            "schema": {
              "$ref": "#/components/schemas/Redizo"
            }
          },
          {
            "name": "prijezd",
            "in": "query",
            "description": "Nejpozdější příjezd (ISO 8601, Europe/Prague). Výchozí je 8:00 nejbližšího školního dne.",
            "schema": {
              "type": "string",
              "format": "date-time"
            },
            "example": "2026-10-12T08:00:00+02:00"
          }
        ],
        "responses": {
          "200": {
            "description": "Nalezené spojení.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Trasa"
                }
              }
            }
          },
          "404": {
            "$ref": "#/components/responses/NenalezenoResponse"
          },
          "422": {
            "$ref": "#/components/responses/NeplatnyParametr"
          },
          "502": {
            "description": "OpenTripPlanner neodpověděl.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Chyba"
                }
              }
            }
          }
        }
      }
    },
    "/dostupnost/obory": {
      "get": {
        "tags": [
          "Dojezdy"
        ],
        "operationId": "listDostupnostOboru",
        "summary": "Žebříček oborů podle dostupnosti pro populaci",
        "description": "Kolik lidí ve zvoleném věku má obor do `max_min` minut veřejnou dopravou.",
        "parameters": [
          {
            "$ref": "#/components/parameters/MaxMin"
          },
          {
            "$ref": "#/components/parameters/VekOd"
          },
          {
            "$ref": "#/components/parameters/VekDo"
          },
          {
            "$ref": "#/components/parameters/Forma"
          },
          {
            "$ref": "#/components/parameters/Stupen"
          },
          {
            "$ref": "#/components/parameters/Scenar"
          },
          {
            "$ref": "#/components/parameters/Razeni"
          }
        ],
        "responses": {
          "200": {
            "description": "Dostupnost oborů.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "data",
                    "meta"
                  ],
                  "properties": {
                    "data": {
                      "type": "array",
                      "items": {
                        "$ref": "#/components/schemas/DostupnostOboru"
                      }
                    },
                    "meta": {
                      "type": "object",
                      "properties": {
                        "max_min": {
                          "type": "integer"
                        },
                        "vek_od": {
                          "type": "integer"
                        },
                        "vek_do": {
                          "type": [
                            "integer",
                            "null"
                          ]
                        },
                        "populace_celkem": {
                          "type": "integer",
                          "description": "Lidé ve zvoleném věku v celém kraji."
                        },
                        "scenar": {
                          "type": "string"
                        },
                        "odhad": {
                          "type": "boolean",
                          "const": true
                        }
                      }
                    }
                  }
                }
              }
            }
          },
          "422": {
            "$ref": "#/components/responses/NeplatnyParametr"
          }
        }
      }
    }
  },
  "components": {
    "headers": {
      "ETag": {
        "description": "Verze importu dat; při shodě s `If-None-Match` vrací API 304.",
        "schema": {
          "type": "string"
        }
      },
      "CacheControl": {
        "description": "Data se mění jen s importem.",
        "schema": {
          "type": "string",
          "example": "public, max-age=3600"
        }
      }
    },
    "parameters": {
      "Rok": {
        "name": "rok",
        "in": "query",
        "description": "Rok demografických dat.",
        "schema": {
          "type": "integer",
          "enum": [
            2021
          ],
          "default": 2021
        }
      },
      "VekOd": {
        "name": "vek_od",
        "in": "query",
        "description": "Spodní mez věku, násobek 5.",
        "schema": {
          "type": "integer",
          "minimum": 0,
          "maximum": 100,
          "multipleOf": 5,
          "default": 15
        }
      },
      "VekDo": {
        "name": "vek_do",
        "in": "query",
        "description": "Horní mez věku (násobek 5 minus 1). Vynechat = bez horní meze (100+).",
        "schema": {
          "type": "integer",
          "minimum": 4,
          "maximum": 99,
          "default": 19
        }
      },
      "Obec": {
        "name": "obec",
        "in": "query",
        "description": "Kód obce ČSÚ (6 číslic).",
        "schema": {
          "$ref": "#/components/schemas/KodObce"
        },
        "example": "554961"
      },
      "Bbox": {
        "name": "bbox",
        "in": "query",
        "description": "Výřez mapy `lon1,lat1,lon2,lat2` (WGS 84).",
        "schema": {
          "type": "string",
          "pattern": "^-?\\d+(\\.\\d+)?(,-?\\d+(\\.\\d+)?){3}$"
        },
        "example": "12.80,50.20,12.95,50.27"
      },
      "Zjednoduseni": {
        "name": "zjednoduseni",
        "in": "query",
        "description": "Tolerance zjednodušení polygonů v metrech (0 = bez zjednodušení).",
        "schema": {
          "type": "integer",
          "minimum": 0,
          "maximum": 500,
          "default": 20
        }
      },
      "Format": {
        "name": "format",
        "in": "query",
        "schema": {
          "type": "string",
          "enum": [
            "geojson",
            "json"
          ],
          "default": "geojson"
        }
      },
      "Limit": {
        "name": "limit",
        "in": "query",
        "schema": {
          "type": "integer",
          "minimum": 1,
          "maximum": 1000,
          "default": 100
        }
      },
      "Offset": {
        "name": "offset",
        "in": "query",
        "schema": {
          "type": "integer",
          "minimum": 0,
          "default": 0
        }
      },
      "Razeni": {
        "name": "razeni",
        "in": "query",
        "description": "Název pole pro řazení; mínus = sestupně.",
        "schema": {
          "type": "string",
          "pattern": "^-?[a-z_]+$"
        },
        "example": "-prihlasky_na_misto"
      },
      "Forma": {
        "name": "forma",
        "in": "query",
        "description": "Forma vzdělávání – `den` denní, `dal` dálková.",
        "schema": {
          "type": "string",
          "enum": [
            "den",
            "dal"
          ]
        }
      },
      "Stupen": {
        "name": "stupen",
        "in": "query",
        "description": "Písmeno stupně vzdělání v kódu KKOV; více hodnot oddělit čárkou.",
        "schema": {
          "type": "string",
          "pattern": "^[CEHKLM](,[CEHKLM])*$"
        },
        "example": "H,M"
      },
      "OborFiltr": {
        "name": "obor",
        "in": "query",
        "description": "Kód oboru KKOV (lomítko zde není třeba kódovat); více hodnot oddělit čárkou.",
        "schema": {
          "type": "string"
        },
        "example": "23-68-H/01"
      },
      "RedizoPath": {
        "name": "redizo",
        "in": "path",
        "required": true,
        "schema": {
          "$ref": "#/components/schemas/Redizo"
        },
        "example": "600009084"
      },
      "ZZsj": {
        "name": "z_zsj",
        "in": "query",
        "description": "Výchozí ZSJ.",
        "schema": {
          "$ref": "#/components/schemas/KodZsj"
        },
        "example": "050946"
      },
      "ZBod": {
        "name": "z",
        "in": "query",
        "description": "Výchozí bod `lat,lon`; použije se ZSJ, do které bod padne.",
        "schema": {
          "$ref": "#/components/schemas/LatLon"
        },
        "example": "50.23,12.87"
      },
      "MaxMin": {
        "name": "max_min",
        "in": "query",
        "description": "Maximální doba dojezdu v minutách.",
        "schema": {
          "type": "integer",
          "minimum": 5,
          "maximum": 180,
          "default": 60
        }
      },
      "Scenar": {
        "name": "scenar",
        "in": "query",
        "description": "Scénář předpočtu dojezdů.",
        "schema": {
          "type": "string",
          "enum": [
            "skolni_den_prijezd_8_00"
          ],
          "default": "skolni_den_prijezd_8_00"
        }
      }
    },
    "responses": {
      "NenalezenoResponse": {
        "description": "Záznam neexistuje.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Chyba"
            },
            "example": {
              "error": {
                "kod": "nenalezeno",
                "zprava": "ZSJ 999999 neexistuje.",
                "pole": "kod_zsj"
              }
            }
          }
        }
      },
      "NeplatnyParametr": {
        "description": "Neplatný parametr.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Chyba"
            },
            "example": {
              "error": {
                "kod": "neplatny_vek",
                "zprava": "Věk musí sledovat 5leté skupiny, např. 15–19.",
                "pole": "vek_od"
              }
            }
          }
        }
      }
    },
    "schemas": {
      "KodZsj": {
        "type": "string",
        "pattern": "^\\d{6}$",
        "description": "Kód ZSJ včetně úvodních nul."
      },
      "KodObce": {
        "type": "string",
        "pattern": "^\\d{6}$"
      },
      "Redizo": {
        "type": "string",
        "pattern": "^\\d{9}$"
      },
      "KodOboru": {
        "type": "string",
        "pattern": "^\\d{2}-\\d{2}-[A-Z]/\\d{2}$",
        "example": "23-68-H/01"
      },
      "LatLon": {
        "type": "string",
        "pattern": "^-?\\d+(\\.\\d+)?,-?\\d+(\\.\\d+)?$"
      },
      "Stupen": {
        "type": "string",
        "enum": [
          "C",
          "E",
          "H",
          "K",
          "L",
          "M"
        ],
        "description": "C praktická škola, E praktické obory, H výuční list, K gymnázium, L maturita s praxí/nástavba, M maturita."
      },
      "PasmoDojezdu": {
        "type": "string",
        "enum": [
          "do15",
          "do30",
          "do45",
          "do60",
          "nad60",
          "bez_spojeni"
        ]
      },
      "Chyba": {
        "type": "object",
        "required": [
          "error"
        ],
        "properties": {
          "error": {
            "type": "object",
            "required": [
              "kod",
              "zprava"
            ],
            "properties": {
              "kod": {
                "type": "string",
                "description": "Strojově čitelný kód chyby."
              },
              "zprava": {
                "type": "string",
                "description": "Česká zpráva pro uživatele."
              },
              "pole": {
                "type": [
                  "string",
                  "null"
                ],
                "description": "Parametr",
                "kterého se chyba týká.": null
              }
            }
          }
        }
      },
      "MetaStrankovani": {
        "type": "object",
        "properties": {
          "celkem": {
            "type": "integer"
          },
          "limit": {
            "type": "integer"
          },
          "offset": {
            "type": "integer"
          }
        }
      },
      "MetaPrijimaciRizeni": {
        "type": "object",
        "properties": {
          "rok_prijimaciho_rizeni": {
            "type": "integer",
            "example": 2026
          },
          "kolo": {
            "type": "integer",
            "example": 1
          }
        }
      },
      "MetaDemografie": {
        "type": "object",
        "properties": {
          "rok": {
            "type": "integer",
            "example": 2021
          },
          "rozhodne_datum": {
            "type": "string",
            "format": "date",
            "example": "2021-03-26"
          },
          "zdroj": {
            "type": "string",
            "example": "SLDB 2021, modelový odhad"
          },
          "odhad": {
            "type": "boolean",
            "const": true
          }
        }
      },
      "VekovaSkupina": {
        "type": "object",
        "required": [
          "id",
          "popis",
          "vek_od"
        ],
        "properties": {
          "id": {
            "type": "string",
            "example": "1300150019"
          },
          "popis": {
            "type": "string",
            "example": "15-19"
          },
          "vek_od": {
            "type": "integer",
            "example": 15
          },
          "vek_do": {
            "type": [
              "integer",
              "null"
            ],
            "example": 19,
            "description": "`null` u skupiny 100+."
          }
        }
      },
      "PopulaceSkupiny": {
        "type": "object",
        "required": [
          "skupina",
          "popis",
          "populace"
        ],
        "properties": {
          "skupina": {
            "type": "string",
            "example": "1300150019"
          },
          "popis": {
            "type": "string",
            "example": "15-19"
          },
          "vek_od": {
            "type": "integer"
          },
          "vek_do": {
            "type": [
              "integer",
              "null"
            ]
          },
          "populace": {
            "type": "integer",
            "minimum": 0
          }
        }
      },
      "Obec": {
        "type": "object",
        "required": [
          "kod_obce",
          "populace"
        ],
        "properties": {
          "kod_obce": {
            "$ref": "#/components/schemas/KodObce"
          },
          "nazev": {
            "type": [
              "string",
              "null"
            ],
            "example": "Karlovy Vary"
          },
          "orp": {
            "type": [
              "string",
              "null"
            ],
            "example": "Karlovy Vary"
          },
          "populace": {
            "type": "integer"
          },
          "pocet_zsj": {
            "type": "integer"
          }
        }
      },
      "Obor": {
        "type": "object",
        "required": [
          "kod",
          "nazev",
          "stupen",
          "pocet_skol",
          "kapacita",
          "prihlasky"
        ],
        "properties": {
          "kod": {
            "$ref": "#/components/schemas/KodOboru"
          },
          "nazev": {
            "type": "string",
            "example": "Mechanik opravář motorových vozidel"
          },
          "stupen": {
            "$ref": "#/components/schemas/Stupen"
          },
          "pocet_skol": {
            "type": "integer",
            "example": 4
          },
          "kapacita": {
            "type": "integer",
            "example": 109
          },
          "prihlasky": {
            "type": "integer",
            "example": 455
          },
          "prihlasky_na_misto": {
            "type": [
              "number",
              "null"
            ],
            "example": 4.17
          }
        }
      },
      "OborStatistiky": {
        "allOf": [
          {
            "$ref": "#/components/schemas/Obor"
          },
          {
            "type": "object",
            "properties": {
              "nabidky": {
                "type": "array",
                "items": {
                  "$ref": "#/components/schemas/Nabidka"
                }
              },
              "dostupnost": {
                "type": [
                  "null",
                  "array"
                ],
                "description": "Podíl dětí 15–19 let s oborem do 30 / 45 / 60 minut.",
                "items": {
                  "type": "object",
                  "properties": {
                    "max_min": {
                      "type": "integer",
                      "enum": [
                        30,
                        45,
                        60
                      ]
                    },
                    "populace_v_dosahu": {
                      "type": "integer"
                    },
                    "podil_v_dosahu": {
                      "type": "number",
                      "description": "%"
                    }
                  }
                }
              }
            }
          }
        ]
      },
      "ZsjVlastnosti": {
        "type": "object",
        "required": [
          "kod_zsj",
          "nazev",
          "kod_obce",
          "populace"
        ],
        "properties": {
          "kod_zsj": {
            "$ref": "#/components/schemas/KodZsj"
          },
          "nazev": {
            "type": "string"
          },
          "kod_obce": {
            "$ref": "#/components/schemas/KodObce"
          },
          "nazev_obce": {
            "type": [
              "string",
              "null"
            ]
          },
          "populace": {
            "type": "integer"
          },
          "lat": {
            "type": "number",
            "description": "Bod uvnitř polygonu (ST_PointOnSurface)."
          },
          "lon": {
            "type": "number"
          }
        }
      },
      "ZsjDetail": {
        "allOf": [
          {
            "$ref": "#/components/schemas/ZsjVlastnosti"
          },
          {
            "type": "object",
            "required": [
              "vekova_struktura"
            ],
            "properties": {
              "podil_0_14": {
                "type": "number",
                "description": "%"
              },
              "podil_15_64": {
                "type": "number",
                "description": "%"
              },
              "podil_65_plus": {
                "type": "number",
                "description": "%"
              },
              "vekova_struktura": {
                "type": "array",
                "items": {
                  "$ref": "#/components/schemas/PopulaceSkupiny"
                }
              },
              "geometry": {
                "$ref": "#/components/schemas/GeoPolygon"
              },
              "meta": {
                "$ref": "#/components/schemas/MetaDemografie"
              }
            }
          }
        ]
      },
      "Demografie": {
        "type": "object",
        "required": [
          "uroven",
          "rok",
          "populace",
          "data"
        ],
        "properties": {
          "uroven": {
            "type": "string",
            "enum": [
              "zsj",
              "obec",
              "kraj"
            ]
          },
          "kod": {
            "type": [
              "string",
              "null"
            ]
          },
          "rok": {
            "type": "integer"
          },
          "populace": {
            "type": "integer"
          },
          "data": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/PopulaceSkupiny"
            }
          },
          "meta": {
            "$ref": "#/components/schemas/MetaDemografie"
          }
        }
      },
      "GeoPolygon": {
        "type": "object",
        "required": [
          "type",
          "coordinates"
        ],
        "properties": {
          "type": {
            "type": "string",
            "const": "Polygon"
          },
          "coordinates": {
            "type": "array",
            "items": {
              "type": "array",
              "items": {
                "type": "array",
                "minItems": 2,
                "maxItems": 2,
                "items": {
                  "type": "number"
                }
              }
            }
          }
        }
      },
      "GeoPoint": {
        "type": "object",
        "required": [
          "type",
          "coordinates"
        ],
        "properties": {
          "type": {
            "type": "string",
            "const": "Point"
          },
          "coordinates": {
            "type": "array",
            "minItems": 2,
            "maxItems": 2,
            "items": {
              "type": "number"
            },
            "example": [
              12.95214,
              50.30477
            ]
          }
        }
      },
      "ZsjFeatureCollection": {
        "type": "object",
        "required": [
          "type",
          "features"
        ],
        "properties": {
          "type": {
            "type": "string",
            "const": "FeatureCollection"
          },
          "features": {
            "type": "array",
            "items": {
              "type": "object",
              "required": [
                "type",
                "geometry",
                "properties"
              ],
              "properties": {
                "type": {
                  "type": "string",
                  "const": "Feature"
                },
                "geometry": {
                  "$ref": "#/components/schemas/GeoPolygon"
                },
                "properties": {
                  "$ref": "#/components/schemas/ZsjVlastnosti"
                }
              }
            }
          },
          "meta": {
            "allOf": [
              {
                "$ref": "#/components/schemas/MetaDemografie"
              },
              {
                "$ref": "#/components/schemas/MetaStrankovani"
              }
            ]
          }
        }
      },
      "DemografieMapa": {
        "type": "object",
        "required": [
          "type",
          "features",
          "meta"
        ],
        "properties": {
          "type": {
            "type": "string",
            "const": "FeatureCollection"
          },
          "features": {
            "type": "array",
            "items": {
              "type": "object",
              "required": [
                "type",
                "geometry",
                "properties"
              ],
              "properties": {
                "type": {
                  "type": "string",
                  "const": "Feature"
                },
                "geometry": {
                  "$ref": "#/components/schemas/GeoPolygon"
                },
                "properties": {
                  "type": "object",
                  "required": [
                    "kod_zsj",
                    "nazev",
                    "populace",
                    "hodnota"
                  ],
                  "properties": {
                    "kod_zsj": {
                      "$ref": "#/components/schemas/KodZsj"
                    },
                    "nazev": {
                      "type": "string"
                    },
                    "kod_obce": {
                      "$ref": "#/components/schemas/KodObce"
                    },
                    "populace": {
                      "type": "integer",
                      "description": "Celková populace ZSJ."
                    },
                    "pocet_ve_veku": {
                      "type": "integer"
                    },
                    "hodnota": {
                      "type": [
                        "number",
                        "null"
                      ]
                    }
                  }
                }
              }
            }
          },
          "meta": {
            "allOf": [
              {
                "$ref": "#/components/schemas/MetaDemografie"
              },
              {
                "type": "object",
                "properties": {
                  "vek_od": {
                    "type": "integer"
                  },
                  "vek_do": {
                    "type": [
                      "integer",
                      "null"
                    ]
